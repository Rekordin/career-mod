 document.querySelectorAll('[data-an]').forEach(b=>b.onclick=()=>{const r=applyNT(b.dataset.an);save();UI.toast=r.msg;render();});}

// ===================== РЕЖИМ «38-0-0» =====================
// Драфт из 11 карточек (по 3 на выбор) → один сезон внутри лиги. Цель — выиграть все матчи.
const M38_LG=['ENG1','ESP1','ITA1','GER1','FRA1','POR1','RUS1'];
const M38_BEST='fc380Best';
let M=null;
const m38P=s=>POS_RU[s]||{LWB:'ЛФЗ',RWB:'ПФЗ'}[s]||s;

function m38Best(){try{return JSON.parse(localStorage.getItem(M38_BEST)||'{}');}catch(e){return {};}}
function m38SaveBest(){const B=m38Best();const k=M.lg;const r=M.rec;const o=B[k];
 const better=!o||r.w>o.w||(r.w===o.w&&r.d<o.d)||(r.w===o.w&&r.d===o.d&&r.l<o.l);
 if(better){B[k]={w:r.w,d:r.d,l:r.l,n:M.games,form:M.form};try{localStorage.setItem(M38_BEST,JSON.stringify(B));}catch(e){}}return better;}

// ---------- экран настройки ----------
function m38Setup(){G=null;M={lg:M&&M.lg||'ENG1',form:M&&M.form||'4-3-3',name:M&&M.name||'Мой клуб'};
 const B=m38Best();
 const draw=()=>{app.innerHTML=`<div class="page m38"><div class="m38head"><button class="icon" id="mBack" title="Назад">${ic('menu')}</button><b>38-0-0</b><span class="sp"></span></div>
 <div class="card hl"><h2>Собери непобедимых</h2><p class="nh">11 раз тебе выпадают 3 игрока лиги примерно одного уровня — забираешь одного. Твой клуб занимает место самого слабого в лиге и играет один сезон. Цель — выиграть все матчи.</p></div>
 <h3>1. Лига</h3><div class="m38grid">${M38_LG.map(id=>{const b=B[id];return `<button class="btn ghost m38opt${M.lg===id?' on':''}" data-lg="${id}">${flagE(LG[id].c)} <span>${esc(LG[id].n)}</span><i class="small muted">цель ${2*(LG[id].cl.split('|').length-1)}-0-0</i>${b?`<i class="small muted">рекорд ${b.w}-${b.d}-${b.l}</i>`:''}</button>`;}).join('')}</div>
 <h3>2. Схема</h3><div class="m38grid f">${Object.keys(FORMS).map(f=>`<button class="btn ghost m38opt${M.form===f?' on':''}" data-f="${f}">${f}</button>`).join('')}</div>
 <p class="small muted m38slots">${M38_FORMS[M.form].slice().sort((a,b)=>M38_ORD.indexOf(a)-M38_ORD.indexOf(b)).map(s=>m38P(s)).join(' · ')}</p>
 <h3>3. Название</h3><div class="card"><input id="mName" maxlength="24" value="${esc(M.name)}"></div>
 <button class="btn big" id="mGo">Начать драфт</button></div>`;
  document.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{M.name=$('#mName').value;M.lg=b.dataset.lg;draw();});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{M.name=$('#mName').value;M.form=b.dataset.f;draw();});
  $('#mBack').onclick=()=>{M=null;startScreen();};
  $('#mGo').onclick=()=>{M.name=($('#mName').value.trim()||'Мой клуб').slice(0,24);
   app.innerHTML='<div class="start"><div class="logo spin"><i class="ic ic-ball"></i></div><p>Тасуем колоду…</p></div>';
   setTimeout(()=>{m38Init();m38Draft();},30);};};
 draw();}

// ---------- позиции ----------
// в «полуторных» схемах фланговые полузащитники — ЛП/ПП, а не вингеры
const M38_FORMS={};for(const f in FORMS)M38_FORMS[f]=FORMS[f].map(x=>['4-4-2','4-4-1-1','4-1-4-1','5-4-1'].includes(f)?({LW:'LM',RW:'RM'}[x]||x):x);
// соседние позиции: −2; всё остальное — −15; вратарь только в воротах
// игрок встаёт только на свою или дополнительную позицию; исключения (с потерей −2): ЦАП→ЦП, ЦП→ЦОП/ЦАП, ЛВ↔ПВ
const M38_NEAR={CAM:['CM'],CM:['CDM','CAM'],LW:['RW'],RW:['LW']};
const M38_ORD=['GK','RB','RWB','CB','LB','LWB','RM','CDM','CM','CAM','LM','RW','ST','LW'];
function m38Nat(p){const n=[p.pos].concat(p.alt||[]);if(n.includes('LB'))n.push('LWB');if(n.includes('RB'))n.push('RWB');return n;}
function m38Pen(sl,p){if(sl==='GK'||p.pos==='GK')return sl==='GK'&&p.pos==='GK'?0:null;
 const n=m38Nat(p);if(n.includes(sl))return 0;if(n.some(x=>(M38_NEAR[x]||[]).includes(sl)))return -2;return null;}
function m38Eff(x){const p=G.P[x.p];return p.ovr+m38Pen(x.s,p);}
function m38SlotOrd(a,b){return M38_ORD.indexOf(a.s)-M38_ORD.indexOf(b.s);}

// ---------- мир и драфт ----------
// карточки — только игроки выбранной лиги; уровень выбора задаётся местом игрока в рейтинге лиги
// полосы: топ-10, 11–20, 21–30, 31–40, середина лиги, низ лиги. В одном выборе — игроки одной полосы
function m38Init(){createWorld({rusBan:false});G.mode='m38';
 const lg=M.lg;const L=LG[lg];
 const top3=l=>{const r=G.lgClubs[l].map(c=>xiRating(squad(c))).sort((a,b)=>b-a);return (r[0]+r[1]+r[2])/3;};
 M.sh=Math.min(0,Math.round(top3(lg)-top3('ENG1')));// только для цвета карточек
 // команда игрока занимает место самого слабого клуба лиги
 const ids=G.lgClubs[lg].map(c=>[c,xiRating(squad(c))]).sort((a,b)=>b[1]-a[1]).slice(0,-1).map(x=>x[0]);
 const me={id:G.clubs.length,n:M.name,lg:null,c:L.c,rep:75,r:75,pl:[],me:1};G.clubs.push(me);
 M.me=me.id;M.teams=ids.concat([me.id]);M.orig={};M.sel=null;
 M.slots=M38_FORMS[M.form].map(s=>({s,p:null}));M.pick=0;
 const all=[];for(const cid of G.lgClubs[lg])for(const p of squad(cid))if(!p.ret)all.push(p);
 const real=all.filter(p=>!p.g);const pool=(real.length>=150?real:all).sort((a,b)=>b.ovr-a.ovr);M.pool=pool.map(p=>p.id);const N=pool.length;
 M.rank={};pool.forEach((p,i)=>M.rank[p.id]=i);
 M.luck=rnd()*2-1;// удача драфта: от «одни середняки» до «много звёзд»
 M.seen={};M.offer=m38Offer();}
// каждый выбор — тройка соседей по рейтингу лиги; центр тройки берётся из полос рейтинга (доли от числа игроков лиги):
// звёзды (верхние 4%) — редко, сильные (4–14%), середняки (14–35%) — чаще всего, крепкие игроки (35–75%)
// удача драфта M.luck слегка сдвигает веса полос вверх или вниз
const M38_BANDS=[[0,.04,.10],[.04,.14,.27],[.14,.35,.36],[.35,.75,.27]];
function m38Offer(){const P=M.pool;const N=P.length;const ok=i=>{const p=G.P[i];return !M.seen[i]&&p.cl!==M.me&&m38Dest(p);};
 const B=M38_BANDS.map((b,i)=>[b[0],b[1],b[2]*Math.exp((M.luck||0)*(1.5-i)*.8)]);const tw=B.reduce((a,b)=>a+b[2],0);let x=rnd()*tw,band=B[B.length-1];
 for(const b of B){if(x<b[2]){band=b;break;}x-=b[2];}
 const c0=Math.min(N-1,Math.floor(N*(band[0]+rnd()*(band[1]-band[0]))));
 let L=c0-6,H=c0+6,c=[];
 for(let k=0;k<80;k++){c=P.slice(Math.max(0,L),Math.min(H+1,N)).filter(ok);if(c.length>=3||(L<=0&&H>=N-1))break;L-=4;H+=4;}
 const out=[];while(out.length<3&&c.length)out.push(c.splice(ri(0,c.length-1),1)[0]);
 out.forEach(i=>M.seen[i]=1);return out;}
function m38Tier(o,id){if(id!==undefined&&M.rank&&M.rank[id]!==undefined){const r=M.rank[id];return r<10?0:r<30?1:r<60?2:3;}const h=M.sh||0;return o>=88+h?0:o>=82+h?1:o>=76+h?2:3;}
function m38Dest(p){let best=null,bv=-99;M.slots.forEach(x=>{if(x.p!==null)return;const v=m38Pen(x.s,p);if(v!==null&&v>bv){bv=v;best=x;}});return best;}
function m38Take(pid){const p=G.P[pid];const d=m38Dest(p);M.orig[pid]=p.cl;d.p=pid;moveP(p,M.me);M.pick++;
 if(M.pick<11)M.offer=m38Offer();else m38Ready();}
// перестановка: выбрать слот, затем другой — игроки меняются местами (вратарь только в воротах)
function m38Tap(i){if(M.done)return;const S=M.slots;if(M.sel===null){if(S[i].p!==null)M.sel=i;return;}
 if(M.sel===i){M.sel=null;return;}const a=S[M.sel],b=S[i];
 const ok=(pid,sl)=>pid===null||m38Pen(sl,G.P[pid])!==null;
 if(ok(a.p,b.s)&&ok(b.p,a.s)){[a.p,b.p]=[b.p,a.p];M.sel=null;if(M.xi)m38MyXI();}
 else{M.sel=null;toast('Этот игрок не может играть на этой позиции');}}

function m38Card(p){const t=m38Tier(p.ovr,p.id);const cl=p.cl>=0&&p.cl!==M.me?G.clubs[p.cl]:null;const d=m38Dest(p);const pen=d?m38Pen(d.s,p):0;
 return `<div class="m38c t${t}"><div class="m38o"><b>${p.ovr}</b><span>${POS_RU[p.pos]}</span></div>
 <div class="m38n">${esc(p.n)}</div><div class="m38m">${flagE(p.nat)} ${p.age} лет${p.alt&&p.alt.length?' · также '+p.alt.map(a=>POS_RU[a]).join(', '):''}</div>
 ${cl?`<div class="m38m">${crest(cl.id)} ${esc(cl.n)}</div>`:''}<i class="m38t">${d?'→ '+m38P(d.s)+(pen?` <b class="neg">${pen}</b>`:''):''}</i></div>`;}

const M38_Y={GK:90,CB:74,LB:70,RB:70,LWB:56,RWB:56,CDM:59,CM:46,LM:44,RM:44,CAM:32,LW:20,RW:20,ST:10};
const M38_SIDE={LB:-1,LWB:-1,LM:-1,LW:-1,RB:1,RWB:1,RM:1,RW:1};
function m38Pitch(){const rows={};M.slots.forEach((x,i)=>{const y=M38_Y[x.s];(rows[y]=rows[y]||[]).push(i);});const pts=[];
 for(const y in rows){const r=rows[y];const c=r.filter(i=>!M38_SIDE[M.slots[i].s]);const sd=r.filter(i=>M38_SIDE[M.slots[i].s]);
  c.forEach((i,k)=>pts.push({x:50+(k-(c.length-1)/2)*(c.length>=3?25:28),y:+y,i}));sd.forEach(i=>pts.push({x:M38_SIDE[M.slots[i].s]<0?13:87,y:+y,i}));}
 return `<div class="pitch m38pitch">${pts.map(t=>{const x=M.slots[t.i];const p=x.p!==null?G.P[x.p]:null;const pen=p?m38Pen(x.s,p):0;
  return `<div class="pp m38pp${M.sel===t.i?' sel':''}${p?'':' empty'}" data-sl="${t.i}" style="left:${t.x}%;top:${t.y}%">${p?`<b class="ovr-s ${oCls(p.ovr+pen)}">${p.ovr+pen}</b><span>${esc(p.n.split(' ').slice(-1)[0])}</span><i>${m38P(x.s)}${pen?` <em class="neg">${pen}</em>`:''}</i>`:`<b class="ovr-s m38e">${m38P(x.s)}</b>`}</div>`;}).join('')}</div>
 ${M.done?'':'<p class="small muted c nh">Нажмите на игрока, затем на другую позицию — они поменяются местами.</p>'}`;}
function m38BindPitch(redraw){document.querySelectorAll('.m38pp').forEach(b=>b.onclick=()=>{m38Tap(+b.dataset.sl);redraw();});}

function m38Draft(){
 app.innerHTML=`<div class="page m38"><div class="m38head"><button class="icon" id="mBack" title="Выйти">${ic('menu')}</button><b>Драфт · ${M.pick+1}/11</b><span class="sp"></span><span class="small muted">${esc(LG[M.lg].n)} · ${M.form}</span></div>
 <h3>Выбери одного</h3><div class="m38cards">${M.offer.map(id=>`<button class="m38pick" data-p="${id}">${m38Card(G.P[id])}</button>`).join('')}</div>
 <h3>Состав</h3>${m38Pitch()}</div>`;
 document.querySelectorAll('.m38pick').forEach(b=>b.onclick=()=>{M.sel=null;m38Take(+b.dataset.p);if(M.pick<11)m38Draft();else m38Season();});
 m38BindPitch(m38Draft);$('#mBack').onclick=m38Quit;}
function m38Quit(){showModal(`<h2>Выйти из режима?</h2><p>Текущий драфт и сезон не сохраняются.</p><div class="btns"><button class="btn bad" id="y">Выйти</button><button class="btn ghost" id="n">Остаться</button></div>`);
 $('#n').onclick=closeModal;$('#y').onclick=()=>{closeModal();G=null;M=null;startScreen();};}

// ---------- сезон ----------
// баланс подобран так, чтобы идеальный сезон удавался примерно в 2–3% драфтов в каждой лиге
const M38_SL=typeof M38SL_OVR!=='undefined'?M38SL_OVR:{ENG1:1.9,ESP1:1.8,ITA1:1.9,GER1:1.8,FRA1:1.7,POR1:1.6,RUS1:2.1};
const M38_DM=typeof M38DM_OVR!=='undefined'?M38DM_OVR:{ENG1:[12,320],ESP1:[11,320],ITA1:[9,320],GER1:[15,320],FRA1:[11,320],POR1:[8,320],RUS1:[4,280]};
const M38_CHEM=typeof M38CHEM_OVR!=='undefined'?M38CHEM_OVR:.009;
// скрытая химия: связи игроков из одного реального клуба (сильные) и одной сборной (слабее).
// у каждого игрока химия 0–3, у состава 0–33. Плюс штраф за игроков не на родной позиции.
// итог — поправка к силе состава в пунктах рейтинга: химия весит столько же, сколько средний рейтинг
const M38_OFF=typeof M38OFF_OVR!=='undefined'?M38OFF_OVR:1.1;
function m38ChemInfo(){const S=M.slots.filter(x=>x.p!==null);const pc={},pn={};S.forEach(x=>{pc[x.p]=0;pn[x.p]=0;});let cl=0,na=0;
 for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++){const a=G.P[S[i].p],b=G.P[S[j].p];
  if(M.orig[a.id]!==undefined&&M.orig[a.id]===M.orig[b.id]){cl++;pc[a.id]+=1.5;pc[b.id]+=1.5;}else if(a.nat===b.nat){na++;pn[a.id]+=M38_NAT;pn[b.id]+=M38_NAT;}}
 const sum=S.reduce((a,x)=>a+Math.min(3,pc[x.p]+Math.min(1,pn[x.p])),0);const off=S.filter(x=>m38Pen(x.s,G.P[x.p])<0).length;
 const c=sum<M38_C0?(sum-M38_C0)/M38_KLO:(sum-M38_C0)/M38_KHI;
 const k=M38_CS[M.lg]||1;const ch=clamp(c,-6,6)*k;return {cl,na,sum,off,chem:ch,adj:ch-off*M38_OFF*k};}
const M38_CS={RUS1:.6,POR1:.9};// в лигах с маленьким разбросом силы клубов сыгранность весит пропорционально меньше
const M38_C0=typeof M38C0_OVR!=='undefined'?M38C0_OVR:10,M38_KLO=typeof M38KLO_OVR!=='undefined'?M38KLO_OVR:1.7,M38_KHI=typeof M38KHI_OVR!=='undefined'?M38KHI_OVR:3,M38_NAT=.3;
function m38MyXI(){M.xi[M.me]=M.slots.map(x=>({p:G.P[x.p],sl:x.s,e:m38Eff(x)}));M.r[M.me]=M.xi[M.me].reduce((a,x)=>a+x.e,0)/11;const ci=m38ChemInfo();M.ci=ci;M.reff=M.r[M.me]+ci.adj;G.clubs[M.me].r=G.clubs[M.me].rep=r1(M.r[M.me]);}
function m38Ready(){M.xi={};M.r={};for(const c of M.teams){if(c===M.me)continue;const sq=squad(c).filter(p=>!p.ret);const xi=greedy(sq,0,null,FORMS[bestForm(sq)]);M.xi[c]=xi;M.r[c]=xi.reduce((a,x)=>a+x.e,0)/xi.length;}
 m38MyXI();
 const T=M.teams.slice();for(let i=T.length-1;i>0;i--){const j=ri(0,i);[T[i],T[j]]=[T[j],T[i]];}
 if(T.length%2)T.push(-1);const n=T.length,R=[];
 for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=T[i],b=T[n-1-i];if(a<0||b<0)continue;pr.push(r%2?[b,a]:[a,b]);}R.push(pr);T.splice(1,0,T.pop());}
 M.rounds=R.concat(R.map(pr=>pr.map(([a,b])=>[b,a])));M.rd=0;M.games=2*(M.teams.length-1);
 M.tab={};M.teams.forEach(c=>M.tab[c]=[0,0,0,0,0,0,0]);
 M.st={};M.res=[];M.rec={w:0,d:0,l:0};M.brk=null;M.done=false;}
// вероятности [победа хозяев, ничья, победа гостей]
function m38R(c){return c===M.me&&M.reff!==undefined?M.reff:M.r[c];}
function m38Probs(h,a){const rh=m38R(h)+1.5,ra=m38R(a);const d=Math.abs(rh-ra);
 const nl=.62*Math.exp(-d/(M38_SL[M.lg]||2))+.001;const pd=nl*.45,pw=nl-pd;let P=rh>=ra?[1-nl,pd,pw]:[pw,pd,1-nl];
 return P;}
function m38Play(h,a){const P=m38Probs(h,a);const x=rnd();const res=x<P[0]?'h':x<P[0]+P[1]?'d':'a';
 const d=Math.abs(m38R(h)+1.5-m38R(a));const strongH=m38R(h)+1.5>=m38R(a);
 const sres=res==='d'?0:(res==='h')===strongH?1:-1;const [gs,gw]=scoreFor(sres,d,1);const hg=strongH?gs:gw,ag=strongH?gw:gs;
 const T=M.tab;const up=(c,f,g)=>{const t=T[c];t[0]++;t[4]+=f;t[5]+=g;if(f>g){t[1]++;t[6]+=3;}else if(f===g){t[2]++;t[6]+=1;}else t[3]++;};up(h,hg,ag);up(a,ag,hg);
 const sc=[],as=[];m38Goals(h,hg,sc,as);m38Goals(a,ag,sc,as);
 for(const c of [h,a]){M.xi[c].forEach(x=>{const s=M.st[x.p.id]||(M.st[x.p.id]=[0,0,0,0]);s[0]++;});if((c===h?ag:hg)===0){const gk=M.xi[c].find(x=>x.sl==='GK');if(gk)M.st[gk.p.id][3]++;}}
 if(h===M.me||a===M.me){const home=h===M.me;const gf=home?hg:ag,ga=home?ag:hg;const k=gf>ga?'w':gf===ga?'d':'l';M.rec[k]++;
  const e={rd:M.rd+1,opp:home?a:h,home,gf,ga,k,sc:sc.filter(s=>s.c===M.me).map(s=>s.n)};M.res.push(e);if(k!=='w'&&!M.brk)M.brk=e;}}
function m38Goals(c,n,sc,as){const xi=M.xi[c];for(let k=0;k<n;k++){
 const i=windex(xi,x=>(GW[x.sl]??GW[x.p.pos]??.1)*Math.pow(x.p.ovr/70,4));if(i<0)continue;const p=xi[i].p;
 const s=M.st[p.id]||(M.st[p.id]=[0,0,0,0]);s[1]++;sc.push({c,n:p.n});
 if(rnd()<.72){const j=windex(xi,(x,jj)=>jj===i?0:(AW[x.sl]??AW[x.p.pos]??.1)*Math.pow(x.p.ovr/70,3));if(j>=0){const q=xi[j].p;const s2=M.st[q.id]||(M.st[q.id]=[0,0,0,0]);s2[2]++;}}}}
function m38Round(){if(M.done)return;for(const [h,a] of M.rounds[M.rd])m38Play(h,a);M.rd++;if(M.rd>=M.rounds.length){M.done=true;M.newBest=m38SaveBest();}}
function m38Order(){return M.teams.slice().sort((a,b)=>{const x=M.tab[a],y=M.tab[b];return y[6]-x[6]||(y[4]-y[5])-(x[4]-x[5])||y[4]-x[4]||G.clubs[a].n.localeCompare(G.clubs[b].n,'ru');});}
function m38Table(){const o=m38Order();return `<div class="scroll"><table class="tbl"><tr><th>#</th><th class="l">Клуб</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>М</th><th>О</th></tr>
 ${o.map((c,i)=>{const t=M.tab[c];return `<tr${c===M.me?' class="my"':''}><td>${i+1}</td><td class="l">${crest(c)} ${esc(G.clubs[c].n)}</td><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}:${t[5]}</td><td><b>${t[6]}</b></td></tr>`;}).join('')}</table></div>`;}
function m38Res(list){return `<div class="m38res">${list.map(e=>`<div class="row"><span class="muted small">${e.rd} тур</span><span class="rt ${e.k==='w'?'r8':e.k==='d'?'r6':'r5'}">${e.gf}:${e.ga}</span><span>${e.home?'дома':'в гостях'} — ${crest(e.opp)} ${esc(G.clubs[e.opp].n)}</span><span class="sp"></span><span class="small muted">${esc(e.sc.map(n=>n.split(' ').slice(-1)[0]).join(', '))}</span></div>`).join('')||'<p class="muted">Сезон ещё не начался.</p>'}</div>`;}
function m38Stats(){const rows=M.slots.slice().sort(m38SlotOrd).map(x=>{const p=G.P[x.p];const s=M.st[p.id]||[0,0,0,0];return {p,sl:x.s,s,e:m38Eff(x)};});
 return `<div class="scroll"><table class="tbl"><tr><th>Поз.</th><th class="l">Игрок</th><th>OVR</th><th>И</th><th>Г</th><th>П</th><th>Сух.</th></tr>
 ${rows.map(r=>`<tr><td>${m38P(r.sl)}</td><td class="l">${esc(r.p.n)} ${flagE(r.p.nat)}</td><td>${r.e}</td><td>${r.s[0]}</td><td>${r.s[1]}</td><td>${r.s[2]}</td><td>${r.sl==='GK'?r.s[3]:''}</td></tr>`).join('')}</table></div>`;}
function m38Scorers(){const all=[];for(const c of M.teams)for(const x of M.xi[c]){const s=M.st[x.p.id];if(s&&s[1])all.push({p:x.p,c,g:s[1],a:s[2]});}
 all.sort((a,b)=>b.g-a.g||b.a-a.a);return `<div class="card">${all.slice(0,8).map((x,i)=>`<div class="row"><b>${i+1}.</b><span>${esc(x.p.n)}</span><span class="small muted">${crest(x.c)} ${esc(G.clubs[x.c].n)}</span><span class="sp"></span><b>${x.g}</b><span class="small muted">гол.</span></div>`).join('')||'<p class="muted">Голов пока нет.</p>'}</div>`;}

function m38Season(){const r=M.rec;const pos=m38Order().indexOf(M.me)+1;const strong=M.teams.filter(c=>c!==M.me).sort((a,b)=>M.r[b]-M.r[a]);
 const live=!M.brk;const goal=M.games+'-0-0';
 const verdict=M.done?(live?`<div class="card win m38v"><b>${goal}</b><p>Идеальный сезон! Ни одного очка потеряно.</p></div>`
   :`<div class="card m38v"><b>${r.w}-${r.d}-${r.l}</b><p>${pos===1?'Чемпионы, но':'Место: '+pos+'. '} до идеала не дотянули. Серия прервалась в ${M.brk.rd} туре: ${M.brk.gf}:${M.brk.ga} с «${esc(G.clubs[M.brk.opp].n)}».${M.newBest?' Это ваш лучший результат в этой лиге.':''}</p></div>`)
  :`<div class="card hl m38v"><b>${r.w}-${r.d}-${r.l}</b><p>${M.rd===0?'Цель — '+goal+'. Сила вашего состава: <b>'+r1(M.r[M.me])+'</b>, у лидеров лиги: '+strong.slice(0,3).map(c=>esc(G.clubs[c].n)+' '+r1(M.r[c])).join(', ')+'.':live?'Серия жива! Сыграно '+M.rd+' из '+M.rounds.length+' туров.':'Серия прервалась в '+M.brk.rd+' туре ('+M.brk.gf+':'+M.brk.ga+' с «'+esc(G.clubs[M.brk.opp].n)+'»). Доиграйте сезон.'}</p></div>`;
 app.innerHTML=`<div class="page m38"><div class="m38head"><button class="icon" id="mBack" title="Выйти">${ic('menu')}</button><b>${esc(M.name)}</b><span class="sp"></span><span class="small muted">${esc(LG[M.lg].n)} · ${M.form}</span></div>
 ${verdict}
 ${M.done?`<div class="btns"><button class="btn big" id="mAgain">Начать заново</button></div><div class="btns"><button class="btn ghost" id="mMenu">Главное меню</button></div>`
  :`<div class="btns"><button class="btn" id="mOne">Сыграть тур</button><button class="btn ghost" id="mAll">Симулировать до конца</button></div>`}
 <h3>${M.done?'Итоговая таблица':'Таблица'}</h3>${m38Table()}
 <h3>Наши матчи</h3>${m38Res(M.res.slice().reverse())}
 <h3>Состав</h3>${m38Pitch()}${m38Stats()}
 <h3>Бомбардиры лиги</h3>${m38Scorers()}</div>`;
 m38BindPitch(m38Season);
 $('#mBack').onclick=M.done?()=>{G=null;M=null;startScreen();}:m38Quit;
 if(M.done){$('#mAgain').onclick=()=>m38Setup();$('#mMenu').onclick=()=>{G=null;M=null;startScreen();};}
 else{$('#mOne').onclick=()=>{m38Round();m38Season();};$('#mAll').onclick=()=>{while(!M.done)m38Round();m38Season();window.scrollTo(0,0);};}}

(function(){startScreen();})();
</script></body></html>
