<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Карьера — футбольный менеджер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>:root{--bg:#060a15;--card:rgba(12,18,34,.72);--card2:rgba(255,255,255,.045);--card3:rgba(255,255,255,.08);--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.16);
 --tx:#eef1f8;--mu:#8e98b0;--ac:#e8203a;--ac2:#ff3a55;--acd:#8f0f22;--good:#33d68a;--warn:#f6b445;--bad:#ff4d61;--gold:#f3c84b;--c:12px;--cs:6px;
 --hf:"Unbounded","Exo 2",system-ui,sans-serif;--bf:"Exo 2",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--tx);font:15px/1.42 var(--bf);-webkit-text-size-adjust:100%}
body:before{content:'';position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(6,10,21,.35) 0%,rgba(6,10,21,.72) 45%,rgba(6,10,21,.9) 100%),var(--bgimg) center 70%/cover no-repeat,#060a15}
body:after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(118deg,rgba(232,32,58,.55) 0 3%,transparent 3% 100%),linear-gradient(118deg,transparent 0 92%,rgba(232,32,58,.35) 92% 94%,transparent 94%),linear-gradient(298deg,rgba(232,32,58,.5) 0 4%,transparent 4%)}
body.noscroll{overflow:hidden}
#app{max-width:780px;margin:0 auto;padding-bottom:88px;min-height:100vh}
h1,h2,h3,h4{font-family:var(--hf);font-weight:600}
h1{font-size:24px;margin:8px 0;letter-spacing:.02em}h2{font-size:18px;margin:4px 0 12px;letter-spacing:.01em;line-height:1.25}
h3{font-size:11.5px;margin:16px 0 9px;color:var(--ac2);text-transform:uppercase;letter-spacing:.22em;display:flex;align-items:center;gap:8px}
h3:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(232,32,58,.5),transparent)}
h4{margin:4px 0 6px;font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.14em}
p{margin:6px 0}
.muted{color:var(--mu)}.small{font-size:12.5px}.bad{color:var(--bad)}.c{text-align:center}.hlt{color:var(--warn)}.ok{color:var(--good)}
.sp{flex:1}
/* ---------- старт ---------- */
.start{text-align:center;padding:56px 18px}.start .col{max-width:360px;margin:26px auto}.start .card{text-align:left}
.start h1{font-size:30px;letter-spacing:.34em;text-transform:uppercase;margin-left:.34em}
.start h1+p{font-family:var(--hf);font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--mu)}
.logo{font-size:58px;color:#fff;display:inline-flex;filter:drop-shadow(0 0 18px rgba(232,32,58,.45))}
.logo:after{content:'';display:block}
.spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
.col{display:flex;flex-direction:column;gap:10px}
.page{padding:14px}
/* ---------- окна с углами ---------- */
.card,.mbox,.offer,.evopt,.btn,input,select,textarea,.icon,.ovr,.pill,.sb,.lc,.toast,.mystat span,.tie.my,.fxl span,.warn,.rt,.res,.ovr-s,.up,.pcard .big,.pitch{clip-path:polygon(var(--k,var(--cs)) 0,100% 0,100% calc(100% - var(--k,var(--cs))),calc(100% - var(--k,var(--cs))) 100%,0 100%,0 var(--k,var(--cs)))}
.card,.mbox,.pitch{--k:var(--c)}
.res,.ovr-s,.rt,.fxl span,.up{--k:4px}
.card{position:relative;background:linear-gradient(135deg,transparent calc(var(--c)*.7071 - .5px),var(--ac) calc(var(--c)*.7071 - .5px),var(--ac) calc(var(--c)*.7071 + 1.3px),transparent calc(var(--c)*.7071 + 1.3px)),linear-gradient(315deg,transparent calc(var(--c)*.7071 - .5px),rgba(255,255,255,.25) calc(var(--c)*.7071 - .5px),rgba(255,255,255,.25) calc(var(--c)*.7071 + 1px),transparent calc(var(--c)*.7071 + 1px)),var(--card);
 border:1px solid var(--line);padding:15px;margin:10px 12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.page .card{margin:10px 0}
.card.hl{background:linear-gradient(135deg,transparent calc(var(--c)*.7071 - .5px),var(--ac2) calc(var(--c)*.7071 - .5px),var(--ac2) calc(var(--c)*.7071 + 1.5px),transparent calc(var(--c)*.7071 + 1.5px)),linear-gradient(100deg,rgba(232,32,58,.24),rgba(12,18,34,.75) 60%);border-color:rgba(232,32,58,.45)}
.card.win{border-color:var(--gold);color:var(--gold)}
/* ---------- кнопки и поля ---------- */
.btn{background:linear-gradient(135deg,var(--ac2),var(--ac) 55%,var(--acd));color:#fff;border:0;padding:12px 16px;font:600 14.5px var(--bf);letter-spacing:.03em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:inset 0 1px rgba(255,255,255,.18)}
.btn:active{transform:scale(.98)}.btn.big{padding:15px 18px;font-size:15.5px;width:100%;text-transform:uppercase;letter-spacing:.12em;font-family:var(--hf);font-weight:500;font-size:13px}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost.bad{color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,77,97,.45)}
.btn.bad{background:linear-gradient(135deg,#ff6474,#c51d35);color:#fff}.btn.sm{padding:8px 12px;font-size:13px;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btns .btn{flex:1}
.btns3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 12px}.btns3 .btn:first-child{grid-column:1/-1}
.form label{display:block;font-size:12px;color:var(--mu);margin:9px 0;text-transform:uppercase;letter-spacing:.08em}
input,select,textarea{width:100%;background:rgba(6,10,21,.55);color:var(--tx);border:1px solid var(--line2);padding:10px 11px;font:15px var(--bf);margin-top:5px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ac2) 50%),linear-gradient(135deg,var(--ac2) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
option{background:#0d1427;color:var(--tx)}
textarea{font-family:ui-monospace,monospace;font-size:11px}
.chk{display:flex!important;gap:8px;align-items:flex-start;text-transform:none!important;letter-spacing:0!important}.chk input{width:auto;margin-top:2px;clip-path:none;accent-color:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid4 .btn{padding:9px 3px;font-size:12px}
/* ---------- шапка и навигация ---------- */
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(6,10,21,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--ac),rgba(232,32,58,.1) 50%,transparent) 1}
.ovr{width:44px;height:44px;display:grid;place-items:center;font:600 17px var(--hf);color:#0a0f1c}
.who{display:flex;flex-direction:column;min-width:0}.who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--hf);font-weight:500;font-size:14px;letter-spacing:.02em}.who span{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;white-space:nowrap}.date span{color:var(--mu)}.date b{font-family:var(--hf);font-weight:500;font-size:12px}
.icon{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--tx);width:38px;height:38px;font-size:17px;cursor:pointer;display:grid;place-items:center;padding:0}
.icon.on{background:var(--ac);border-color:var(--ac);color:#fff}
.o85{background:linear-gradient(135deg,#ffe08a,var(--gold))}.o78{background:linear-gradient(135deg,#7ff0b4,#33d68a)}.o70{background:linear-gradient(135deg,#8bd8ff,#4fb3e8)}.o60{background:#c5ccdb}.o50{background:#f0a07f}
.warn{background:rgba(246,180,69,.14);color:var(--warn);padding:8px 12px;font-size:13px;margin:8px 12px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(6,10,21,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:150px;background:none;border:0;color:var(--mu);padding:9px 1px 10px;font:500 10px var(--bf);letter-spacing:.04em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
nav.tabs button i{font-style:normal;font-size:19px}nav.tabs button.on{color:#fff}
nav.tabs button.on:before{content:'';position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--ac);box-shadow:0 0 12px var(--ac);clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
nav.tabs button.on i{color:var(--ac2)}
@media(max-width:480px){nav.tabs button{font-size:9.8px;padding:8px 0 9px}nav.tabs button i{font-size:17px}}
/* ---------- матчи ---------- */
.next .comp{font-weight:600;margin:4px 0;font-family:var(--hf);font-size:13px;letter-spacing:.02em}.vs,.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:8px}
.vs span:first-child,.score span:first-child{text-align:right}.vs b{color:var(--ac2);font-family:var(--hf)}.me{color:#fff;font-weight:700}
.vs span.me{text-shadow:0 0 14px rgba(232,32,58,.7)}
.score b{font:600 30px var(--hf)}
.last.W{box-shadow:inset 3px 0 var(--good)}.last.L{box-shadow:inset 3px 0 var(--bad)}.last.D{box-shadow:inset 3px 0 var(--warn)}
.mystat{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;font-size:13px;align-items:center}.mystat span{background:var(--card3);padding:5px 10px}
.rt{font-weight:700;padding:3px 7px;min-width:38px;text-align:center;color:#06140c;font-family:var(--hf);font-size:12px}
.r8{background:#33d68a}.r7{background:#9be8b8}.r65{background:#e8da8f}.r6{background:#f0b47a}.r5{background:#ff7d6e}.rt.none{background:var(--card3);color:var(--mu)}
td.r8,td.r7,td.r65,td.r6,td.r5{color:#06140c;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 12px}.pill{background:var(--card);border:1px solid var(--line);padding:5px 11px;font-size:13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.pill.bad{border-color:var(--bad)}
.pill b.r8,.pill b.r7,.pill b.r65,.pill b.r6,.pill b.r5{padding:0 5px;color:#06140c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sb{background:var(--card3);padding:10px 6px;text-align:center}.sb b{display:block;font:600 17px var(--hf)}.sb span{font-size:11px;color:var(--mu)}
.mrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}.mrow:last-child{border:0}
.res{width:24px;height:24px;display:grid;place-items:center;font:700 11px var(--hf);color:#06140c;flex:none}.res.W{background:var(--good)}.res.L{background:var(--bad);color:#fff}.res.D{background:var(--warn)}
.mi{flex:1;min-width:0;display:flex;flex-direction:column}.mi b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.sc{font:600 14px var(--hf);white-space:nowrap}.mine{font-size:12px;color:var(--mu);min-width:52px;text-align:right;white-space:nowrap}
/* ---------- таблицы ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{color:var(--mu);font-weight:600;padding:6px 3px;text-align:center;border-bottom:1px solid var(--line2);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.tbl td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}.tbl .l{text-align:left;white-space:normal}
.tbl tr.pl{cursor:pointer}.tbl tr.pl:hover td{background:rgba(255,255,255,.035)}
.tbl tr.my td{background:linear-gradient(90deg,rgba(232,32,58,.22),rgba(232,32,58,.06));color:#fff;font-weight:700}
td.z1{box-shadow:inset 3px 0 var(--good)}td.z2{box-shadow:inset 3px 0 #4fb3e8}td.z3{box-shadow:inset 3px 0 #b48cf0}td.zr{box-shadow:inset 3px 0 var(--bad)}
th.srt{cursor:pointer;user-select:none;white-space:nowrap}th.srt.on{color:var(--ac2)}
.scroll{overflow-x:auto}
.row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row.my{color:#fff;font-weight:700;box-shadow:inset 3px 0 var(--ac);padding-left:8px}.row.big{font-size:17px}
.pos{display:inline-block;min-width:34px;font-size:10.5px;color:var(--mu);letter-spacing:.04em}
.ovr-s{padding:1px 6px;color:#0a0f1c;min-width:30px;text-align:center;display:inline-block;font:600 12px var(--hf)}
.tie{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}.tie span:first-child{text-align:right}
.tie b{white-space:nowrap;color:var(--mu);font-family:var(--hf);font-size:12px}.tie .w{font-weight:700;color:var(--tx)}.tie.my{background:rgba(232,32,58,.16)}
.pcard{display:flex;gap:14px;align-items:center}.pcard .big{width:70px;height:70px;display:grid;place-items:center;font:600 28px var(--hf);color:#0a0f1c;flex:none;--k:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}.kv span{color:var(--mu)}.kv b{text-align:right;font-weight:600}
.attr{display:grid;grid-template-columns:1fr 90px 30px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.an{display:flex;flex-direction:column;font-size:13.5px}.kw{font-style:normal;color:var(--gold);font-size:11px}.age{font-style:normal;font-size:10.5px;color:var(--mu)}.age.pos{color:var(--good)}.age.neg{color:var(--bad)}
.bar{height:6px;background:rgba(255,255,255,.08);overflow:hidden;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acd),var(--ac2))}
.up{background:linear-gradient(135deg,var(--ac2),var(--ac));border:0;padding:5px 8px;font:700 13px var(--bf);cursor:pointer;color:#fff;min-width:42px}.up small{font-weight:600;font-size:10px;margin-left:2px;opacity:.85}.up:disabled{opacity:.3;cursor:default}
/* ---------- модальные окна ---------- */
.modal{position:fixed;inset:0;background:rgba(3,5,12,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mbox{position:relative;background:linear-gradient(135deg,transparent calc(var(--c)*.7071 - .5px),var(--ac) calc(var(--c)*.7071 - .5px),var(--ac) calc(var(--c)*.7071 + 1.5px),transparent calc(var(--c)*.7071 + 1.5px)),rgba(10,15,29,.9);border:1px solid var(--line2);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 16px 26px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.mbox.wide{max-width:680px}
@media(min-width:700px){.modal{align-items:center}}
.offer{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card3);padding:12px;margin:8px 0;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;font-weight:600;padding:11px 18px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:88vw}
.final{text-align:center}.final .row{text-align:left}
.evopt{display:block;width:100%;text-align:left;background:var(--card3);border:1px solid var(--line);color:var(--tx);padding:12px 13px;margin-top:9px;cursor:pointer;font-family:inherit}.evopt b{display:block;font-size:14.5px;margin-bottom:4px}.evopt span{font-size:12.5px;color:var(--mu)}
.evopt:hover{border-color:rgba(232,32,58,.6)}.evopt:active,.evopt.on{border-color:var(--ac);background:rgba(232,32,58,.14)}.evopt:disabled{opacity:.4}
@media(max-width:420px){.stats{gap:6px}.sb{padding:7px 3px}.sb b{font-size:14px}.sb span{font-size:10.5px}.attr{grid-template-columns:1fr 60px 26px auto}.score b{font-size:24px}.tbl{font-size:12px}}
/* ---------- поле ---------- */
.pitch{position:relative;width:100%;aspect-ratio:3/4;max-height:520px;margin:4px auto;background:repeating-linear-gradient(0deg,rgba(23,52,74,.9) 0 9%,rgba(18,43,62,.9) 9% 18%);border:1px solid rgba(255,255,255,.18);overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.pitch:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.35)}
.pitch:after{content:'';position:absolute;left:30%;right:30%;bottom:0;height:14%;border:1px solid rgba(255,255,255,.35);border-bottom:0}
.pp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;text-align:center}
.pp b{font-size:12px;padding:3px 7px}.pp span{font-size:11px;color:#fff;text-shadow:0 1px 3px #000;line-height:1.15}.pp i{font-style:normal;font-size:9px;color:#c7d1e6;opacity:.9}
.pp i.flg{font-size:inherit}
.board{display:flex;gap:8px;align-items:flex-start}.board .pitch{flex:0 0 58%;aspect-ratio:3/4.4;margin:0}
.board .pp{width:60px;cursor:pointer}.board .pp b{font-size:10.5px;padding:2px 5px}.board .pp span{font-size:10px}.board .pp i{font-size:8.5px}
.pp.sel b{outline:2px solid var(--gold);outline-offset:1px}
.side{flex:1;min-width:0}.side h4{margin:2px 0 5px}
.lc{display:flex;gap:4px;align-items:center;background:var(--card3);padding:5px 6px;margin-bottom:3px;font-size:11px;cursor:pointer;border:1px solid transparent}
.lc span{color:var(--mu);min-width:24px;font-size:10px}.lc b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.lc i.ovr-s{font-style:normal;font-size:10px;padding:1px 4px}
.lc.sel{border-color:var(--gold)}.lc.inj{opacity:.5}
@media(min-width:700px){.board .pitch{flex-basis:62%}.board .pp{width:76px}}
.pp .pz{font-style:normal;font-size:.85em;color:#ffd76a;font-weight:700}.pp sup.neg{color:#ff5a6e;font-size:1.1em;margin-left:1px;vertical-align:top;line-height:1}
.mlog{align-items:start;margin:10px 12px;gap:8px}.mlog h3{font-size:10px}.mlog .card{padding:11px;margin:0}.mlog .row{flex-wrap:wrap;gap:4px}
.mbar{display:grid;grid-template-columns:1fr 46px;gap:3px 8px;align-items:center;font-size:13px;margin:7px 0}.mbar b{text-align:right;font-family:var(--hf);font-size:12px}.mbar .bar{grid-column:1/-1}
.tk{padding:9px 0;border-top:1px solid var(--line)}.tk b.st{float:right}.st.done{color:var(--good)}.st.fail{color:var(--bad)}.st.prog{color:var(--warn)}
.fxl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.fxl span{padding:5px 10px;background:var(--card3);font-size:13px;font-weight:600}
/* ---------- флаги ---------- */
.flg{display:inline-block;width:1.38em;height:.92em;vertical-align:-.08em;clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);position:relative;font-style:normal}
.flg svg{display:block;width:100%;height:100%}
/* ---------- подсказки ---------- */
.hint{display:none!important}
body.hints .hint{display:block!important;border-left:2px solid var(--ac);padding:4px 0 4px 9px;background:linear-gradient(90deg,rgba(232,32,58,.09),transparent)}
.hbtn{position:absolute;top:12px;right:12px;width:30px;height:30px;font-size:15px;z-index:2}
.mbox.hashint h2{padding-right:38px}

.offer>div{min-width:0;flex:1}.offer>.col,.offer>button{flex:none}

.btn.ghost.bad{background:rgba(255,77,97,.07)!important;color:#ff8a97!important;box-shadow:inset 0 0 0 1px rgba(255,77,97,.5)!important}
.btn.bad:not(.ghost){color:#fff!important}
.mx{position:absolute;top:12px;right:12px;width:32px;height:32px;font-size:15px;z-index:3}

 G={v:1,year:2026,slot:0,set:{rusBan:opts.rusBan!==false},clubs:[],P:[],lgClubs:{},prevStand:{},hist:[],season:null,user:null,pending:null,msg:[]};
 for(const l of LEAGUES){G.lgClubs[l.id]=[];
  for(const e of l.cl.split('|')){const [n,r]=e.split(':');const c={id:G.clubs.length,n,lg:l.id,c:l.c,rep:+r,r:+r,pl:[]};G.clubs.push(c);G.lgClubs[l.id].push(c.id);}}
 for(const conf in PHANTOMS){for(const e of PHANTOMS[conf].split('|')){const [n,r]=e.split(':');G.clubs.push({id:G.clubs.length,n,lg:null,c:null,conf,rep:+r,r:+r,pl:[],ph:1});}}
 const byName={};G.clubs.forEach(c=>{if(!c.ph)byName[c.n]=c;});
 for(const cn in REAL){const c=byName[cn];if(!c){console.warn('нет клуба',cn);continue;}
  for(const e of REAL[cn].split(';')){const [n,pos,by,ovr,nat,al,pt]=e.split(',');const age=2026-(+by);
   const pot=pt?Math.max(+pt,+ovr):age<=22?+ovr+ri(3,8):age<=25?+ovr+ri(0,3):+ovr;const p=newPlayer({n,nat,pos,age,ovr:+ovr,pot,real:1,alt:al?al.split('/').filter(x=>x&&x!==pos):(al===''?null:undefined)});moveP(p,c.id);}}
 for(const c of G.clubs){if(c.ph)continue;
  const have={};const sq0=squad(c.id);sq0.forEach(p=>{const q={LM:'LW',RM:'RW'}[p.pos]||p.pos;have[q]=(have[q]||0)+1;});const big=sq0.length>=18;
  for(const [pos,cnt0,xi] of TEMPLATE){const cnt=big?Math.min(cnt0,pos==='GK'?2:Math.max(xi,1)):cnt0;let h=have[pos]||0;for(let k=0;k<cnt;k++){if(h>0){h--;continue;}genForClub(c.id,pos,k<xi?0:(k===cnt-1&&cnt>1?2:1),c.lg);}}
  // подгоняем силу состава под рейтинг клуба
  for(let it=0;it<2;it++){const xr=xiRating(squad(c.id));const d=Math.round(c.rep-xr);if(d===0)break;squad(c.id).forEach(p=>{if(p.g){p.ovr=clamp(p.ovr+d,35,93);p.pot=Math.max(p.pot+d,p.ovr);}});}
  squad(c.id).forEach(p=>{if(p.g){p.ovr=Math.min(p.ovr,84);p.pot=Math.min(p.pot,85);}});
  c.r=r1(xiRating(squad(c.id)));}
 rankCompress(true);G.rk=1;G.altv=1;
}

// --------- состав на матч ---------
function greedy(av,noise,exclude,slots){const used=new Set(exclude||[]);const xi=[];
 for(const sl of (slots||SLOTS)){let best=null,bv=-1e9;for(const p of av){if(used.has(p.id))continue;const v=p.ovr+pcompat(sl,p)+(noise?rnd()*noise:0)+(p.boostC>G.slot?3:0);if(v>bv){bv=v;best=p;}}
  if(best){used.add(best.id);xi.push({p:best,sl,e:best.ovr+pcompat(sl,best)});}}
 return xi;}
function xiRating(sq){const av=sq.filter(p=>!p.ret);const xi=greedy(av,0);if(!xi.length)return 50;return xi.reduce((a,x)=>a+x.e,0)/xi.length;}
function formBonus(){const u=G.user;const f=u.form;if(!f.length)return 0;const last=f[f.length-1];const avg=f.reduce((a,b)=>a+b,0)/f.length;return (last-6.8)*3.5+(avg-6.8)*1.5;}
function lineup(sq,rest,slots,force){
 let av=sq.filter(p=>!(p.inj>G.slot)&&!p.ret&&!(p.u&&G.user.frozen));
 if(rest>0&&av.length>15)av=av.filter(p=>p.u||(force&&force.includes(p.id))||rnd()>rest);
 const up=av.find(p=>p.u);let xi;
 if(up){const others=av.filter(p=>!p.u);const base=greedy(others,1.2);const ps=prefSlot(up.pos);
  const cands=base.filter(x=>x.sl===ps);let rival=cands.length?cands.reduce((a,b)=>a.e<b.e?a:b):null;
  const us=up.ovr+pcompat(ps,up)+formBonus()+((G.user.ctr??50)-50)/14+(G.user.boost>0?4:0)+(rest>=.3&&up.age<=21?4:0);const pr=G.user.benchN>0?0:rival?1/(1+Math.exp(-(us-rival.e+1.5)/2.2)):1;
  G.user.lastStartP=pr;
  if(rnd()<pr){const me={p:up,sl:ps,e:up.ovr+pcompat(ps,up)};xi=rival?base.map(x=>x===rival?me:x):base.concat([me]);}
  else xi=base;}
 else if(force&&force.length){const fp=av.filter(p=>force.includes(p.id));xi=greedy(fp,0,null,slots);const used=new Set(xi.map(x=>x.p.id));const rem=(slots||SLOTS).slice();xi.forEach(x=>{const i=rem.indexOf(x.sl);if(i>=0)rem.splice(i,1);});if(rem.length)xi=xi.concat(greedy(av.filter(p=>!used.has(p.id)),0,null,rem));}
 else xi=greedy(av,slots?0:1.2,null,slots);
 const inXI=new Set(xi.map(x=>x.p.id));const bench=av.filter(p=>!inXI.has(p.id)).sort((a,b)=>b.ovr-a.ovr).slice(0,12);
 const rating=xi.length?xi.reduce((a,x)=>a+x.e,0)/xi.length:50;
 return {xi,bench,rating:xi.length<11?rating-(11-xi.length)*3:rating};}

// --------- зарплаты ---------
function lgWage(cid){const c=G.clubs[cid];return c&&c.lg?LG[c.lg].w:0.5;}
function wageFor(ovr,cid){return Math.round(1e6*Math.exp((ovr-75)/6.2)*lgWage(cid)/1000)*1000;}
function valueFor(p){const a=p.age;const f=a<=21?2.2:a<=24?1.8:a<=27?1.4:a<=30?1:a<=33?.55:.25;return Math.round(Math.min(2.6e8,4e6*Math.exp((p.ovr-72)/5.2)*f*((p.pot-p.ovr)*.03+1))/1e5)*1e5;}

// --------- календарь ---------
const MD8=[9,13,17,21,25,31,37,39],MD6=[9,13,17,21,25,31];
const CLUB_KO=[[43,45],[49,51],[57,59],[65,67],[75]];
const CUP_SLOTS=[[7],[19],[29],[55],[71]];
const NAT_GRP=[82,84,86],NAT_KO=[[88],[90],[92],[94],[96]];
const WINTER_SLOT=42,LAST_CLUB_SLOT=79;
function slotDate(s){let d;if(s>=80){d=new Date(G.year+1,5,8+(s-80)*3);}else{const w=Math.floor(s/2);d=new Date(G.year,7,15+w*7+(s%2?3:0));}
 return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});}
function stageName(n){return n===2?'Финал':n===4?'1/2 финала':n===8?'1/4 финала':n===16?'1/8 финала':n===32?'1/16 финала':'1/'+(n/2)+' финала';}
function natYear(){const y=G.year+1;return y%4===2?'WC':y%4===0?'CONT':null;}

function addFx(s,c,h,a,x){const f={i:G.season.fx.length,s,c,h,a,hg:0,ag:0,p:0};if(x)Object.assign(f,x);G.season.fx.push(f);return f;}
function newTable(ts){const t={};ts.forEach(x=>t[x]=[0,0,0,0,0,0,0]);return t;}
function sortIds(t,ids,nat){return ids.slice().sort((x,y)=>{const a=t[x],b=t[y];return b[6]-a[6]||(b[4]-b[5])-(a[4]-a[5])||b[4]-a[4];});}
function tableAdd(t,h,a,hg,ag){const H=t[h],A=t[a];if(!H||!A)return;H[0]++;A[0]++;H[4]+=hg;H[5]+=ag;A[4]+=ag;A[5]+=hg;
 if(hg>ag){H[1]++;A[3]++;H[6]+=3;}else if(hg<ag){A[1]++;H[3]++;A[6]+=3;}else{H[2]++;A[2]++;H[6]++;A[6]++;}}
function roundRobin(ids,double){const t=ids.slice();if(t.length%2)t.push(-1);const n=t.length,rounds=[];
 for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a!==-1&&b!==-1)pr.push(r%2?[b,a]:[a,b]);}rounds.push(pr);t.splice(1,0,t.pop());}
 if(double){const sec=rounds.map(r=>r.map(([a,b])=>[b,a]));return rounds.concat(sec);}return rounds;}

function lgUpset(k){if(k.startsWith('L:'))return LG[k.slice(2)].up;if(k.startsWith('C:'))return LG[COUNTRY_TOP[k.slice(2)]].up;return [.15,.30];}

function startSeason(){natDepth();
 const prevLast=G.season?lastSlot():0;
 G.season={y:G.year,comps:{},fx:[],winter:0,nat:natYear()};G.slot=0;
 G.P.forEach(p=>{p.s=null;p.sl=null;if(p.inj)p.inj=Math.max(0,p.inj-prevLast-13);if(!p.ret&&!p.u&&p.cl>=0&&p.cy===undefined)p.cy=ri(1,5);});
 if(G.user&&!G.user.retired){const u=G.user;u.log=[];u.ss={k:{},team:{}};u.earnS=0;u.evDev=0;u.called=false;u.frozen=0;u.ballonBoost=0;if(u.shockMax===undefined){u.shockMax=3;u.shockN=0;}G.season.shock=null;
  if(u.accused===1&&rnd()<.7)G.season.shock={s:ri(10,70),id:'cleared'};else if(u.shockN<u.shockMax&&rnd()<.2)G.season.shock={s:ri(10,72)};
  const ev=[];const n=ri(5,7);const span=70/n;for(let i=0;i<n;i++)ev.push(Math.round(6+i*span+rnd()*span*.8));G.season.ev=ev;/* равномерно по сезону */G.season.evUsed=[];if(typeof p2SeasonStart==='function')p2SeasonStart();}
 const C=G.season.comps;
 // лиги
 for(const l of LEAGUES){const ids=G.lgClubs[l.id];const k='L:'+l.id;const dbl=ids.length<=24;
  const rounds=shuffle(roundRobin(shuffle(ids.slice()),dbl).map((r,i)=>[i,r])).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const R=rounds.length;let slots=[];
  if(R<=39){for(let i=0;i<R;i++)slots.push(2*(1+Math.round(i*38/Math.max(1,R-1))));}
  else{for(let w=1;w<=39;w++)slots.push(2*w);const ex=[11,15,23,27,33,41,47,53,61,69];for(let i=0;i<R-39;i++)slots.push(ex[i]);slots.sort((a,b)=>a-b);}
  C[k]={k,n:l.n,kind:'league',lg:l.id,teams:ids.slice(),table:newTable(ids),up:l.up};
  rounds.forEach((r,i)=>r.forEach(([h,a])=>addFx(slots[i],k,h,a)));}
 // кубки
 const byC={};LEAGUES.forEach(l=>{(byC[l.c]=byC[l.c]||[]).push(...G.lgClubs[l.id].map(id=>({id,t:l.t})));});
 for(const c in byC){const all=byC[c];const size=Math.min(32,lowPow2(all.length));
  let ts=shuffle(all.filter(x=>x.t===1)).slice(0,size);if(ts.length<size)ts=ts.concat(shuffle(all.filter(x=>x.t===2)).slice(0,size-ts.length));
  const ids=ts.map(x=>x.id);const nR=Math.log2(size);const k='C:'+c;
  C[k]={k,n:CUP_NAMES[c],kind:'cup',teams:ids,up:LG[COUNTRY_TOP[c]].up,koSlots:CUP_SLOTS.slice(5-nR),ko:[],pts:CAREER_PTS.cup};
  shuffle(ids);const pairs=[];for(let i=0;i<ids.length;i+=2)pairs.push([ids[i],ids[i+1]]);koStage(C[k],pairs,0);}
 // еврокубки
 const st=k=>G.prevStand[k]||G.lgClubs[k].slice().sort((a,b)=>G.clubs[b].rep-G.clubs[a].rep);
 const q={UCL:[],UEL:[],UECL:[]};
 for(const c in EURO_SLOTS){if(c==='RUS'&&G.set.rusBan)continue;const lg=COUNTRY_TOP[c];const s=st(lg).filter(id=>G.clubs[id].lg===lg);const [a,b,d]=EURO_SLOTS[c];
  q.UCL.push(...s.slice(0,a));q.UEL.push(...s.slice(a,a+b));q.UECL.push(...s.slice(a+b,a+b+d));}
 const ph=shuffle(G.clubs.filter(c=>c.ph&&c.conf==='UEFA')).sort((a,b)=>b.rep-a.rep+(rnd()-.5)*3).map(c=>c.id);
 let pi=0;for(const k of ['UCL','UEL','UECL']){while(q[k].length<36)q[k].push(ph[pi++]);}
 const EN={UCL:'Лига чемпионов',UEL:'Лига Европы',UECL:'Лига конференций'};
 for(const k of ['UCL','UEL','UECL']){C[k]={k,n:EN[k],kind:'swiss',teams:q[k],table:newTable(q[k]),up:[.15,.30],md:k==='UECL'?MD6:MD8,koSlots:CLUB_KO,ko:[],pts:CAREER_PTS[k]};swissDraw(C[k]);}
 // другие континентальные клубные турниры
 const conti=(k,n,teams,conf,size,pts)=>{const phs=G.clubs.filter(c=>c.ph&&c.conf===conf).sort((a,b)=>b.rep-a.rep).map(c=>c.id);let i=0;while(teams.length<size&&i<phs.length)teams.push(phs[i++]);
  const sorted=teams.slice().sort((a,b)=>G.clubs[b].rep-G.clubs[a].rep);C[k]={k,n,kind:'grp',teams:sorted,table:newTable(sorted),up:[.18,.33],koSlots:size>=32?CLUB_KO.slice(1):CLUB_KO.slice(2),ko:[],pts};makeGroups(C[k],sorted,true,MD6);};
 conti('LIB','Кубок Либертадорес',st('BRA1').slice(0,7).concat(st('ARG1').slice(0,6)),'CONMEBOL',32,CAREER_PTS.LIB);
 conti('ACL','Азиатская лига чемпионов',st('KSA1').slice(0,4),'AFC',16,CAREER_PTS.ACL);
 conti('CCC','Кубок чемпионов КОНКАКАФ',st('USA1').slice(0,6),'CONCACAF',16,CAREER_PTS.CCC);
 G.clubs.forEach(c=>{if(!c.ph)c.r=r1(xiRating(squad(c.id)));});
 if(G.mode==='coach'&&G.coach)coachSeasonStart();
}

function swissDraw(comp){const ts=comp.teams;const n=comp.md.length;const met={};ts.forEach(t=>met[t]=new Set());
 for(let r=0;r<n;r++){let ok=false;for(let tries=0;tries<200&&!ok;tries++){const pool=shuffle(ts.slice());const pairs=[];ok=true;
   while(pool.length){const a=pool.pop();let j=pool.findIndex(b=>!met[a].has(b)&&(tries>100||G.clubs[a].c!==G.clubs[b].c||!G.clubs[a].c));if(j<0)j=pool.findIndex(b=>!met[a].has(b));if(j<0){ok=false;break;}const b=pool.splice(j,1)[0];pairs.push(rnd()<.5?[a,b]:[b,a]);}
   if(ok){pairs.forEach(([a,b])=>{met[a].add(b);met[b].add(a);addFx(comp.md[r],comp.k,a,b);});}}}}

function makeGroups(comp,sorted,double,mdSlots){const nG=sorted.length/4;const groups=[];for(let g=0;g<nG;g++)groups.push([]);
 for(let p=0;p<4;p++){const pot=shuffle(sorted.slice(p*nG,(p+1)*nG));pot.forEach((t,i)=>groups[i].push(t));}
 comp.groups=groups;comp.md=mdSlots;
 for(const g of groups){const rr=roundRobin(g,double);rr.forEach((r,i)=>r.forEach(([h,a])=>addFx(mdSlots[i],comp.k,h,a,comp.nat?{n:1}:null)));}}

function koStage(comp,pairs,si){const sl=comp.koSlots[si];const two=sl.length===2;const g=comp.ko.length;
 const stg={n:stageName(pairs.length*2),si,sl,ties:pairs.map(([a,b])=>({a,b,w:null}))};comp.ko.push(stg);
 stg.ties.forEach((t,ti)=>{if(two){const f1=addFx(sl[0],comp.k,t.b,t.a,{g,t:ti,leg:1});addFx(sl[1],comp.k,t.a,t.b,{g,t:ti,leg:2,l1:f1.i});}
  else addFx(sl[0],comp.k,t.a,t.b,{g,t:ti,ko:1,n:(pairs.length===1||comp.nat)?1:0});});}

function koPost(comp,s){const stg=comp.ko[comp.ko.length-1];if(!stg||stg.sl[stg.sl.length-1]!==s)return;
 const fx=G.season.fx.filter(f=>f.c===comp.k&&f.g===comp.ko.length-1);
 stg.ties.forEach((t,ti)=>{const fs=fx.filter(f=>f.t===ti);const last=fs[fs.length-1];
  if(fs.length===1){const f=fs[0];t.w=f.hg>f.ag?f.h:f.ag>f.hg?f.a:f.pen;}else{const f2=fs.find(f=>f.leg===2);t.w=f2.agg===undefined?null:f2.aggW;}});
 const w=stg.ties.map(t=>t.w);
 if(w.length===1){comp.winner=w[0];return;}
 const pairs=[];for(let i=0;i<w.length;i+=2)pairs.push([w[i],w[i+1]]);koStage(comp,pairs,stg.si+1);}

function compPost(comp,s){
 if(comp.kind==='cup'){koPost(comp,s);return;}
 if(comp.kind==='swiss'){
  if(s===comp.md[comp.md.length-1]){const ord=sortIds(comp.table,comp.teams);comp.order=ord;comp.direct=ord.slice(0,8);
   const pairs=[];for(let i=8;i<16;i++)pairs.push([ord[i],ord[31-i]]);koStage(comp,pairs,0);return;}
  if(comp.ko.length===1&&s===comp.koSlots[0][1]){koPost0(comp);return;}
  koPost(comp,s);return;}
 if(comp.kind==='grp'){
  if(s===comp.md[comp.md.length-1]&&!comp.ko.length){const firsts=[],secs=[],thirds=[];
   comp.groups.forEach(g=>{const o=sortIds(comp.table,g);firsts.push(o[0]);secs.push(o[1]);thirds.push(o[2]);});
   const by=a=>a.sort((x,y)=>{const A=comp.table[x],B=comp.table[y];return B[6]-A[6]||(B[4]-B[5])-(A[4]-A[5])||B[4]-A[4];});
   by(firsts);by(secs);by(thirds);const K=nextPow2(comp.groups.length*2);const q=firsts.concat(secs,thirds.slice(0,K-comp.groups.length*2));
   const gOf=t=>comp.groups.findIndex(g=>g.includes(t));const pairs=[];const used=new Set();
   for(let i=0;i<K/2;i++){const a=q[i];let j=K-1-i;let b=q[j];
    if(gOf(a)===gOf(b)){for(let k=K-1;k>=K/2;k--){if(!used.has(q[k])&&gOf(q[k])!==gOf(a)&&k!==j){const tmp=q[k];q[k]=b;q[j]=tmp;b=tmp;break;}}}
    used.add(b);pairs.push([a,b]);}
   // разводим пары по сетке: 1-я половина / 2-я половина
   const ord=[];for(let i=0;i<pairs.length/2;i++){ord.push(pairs[i]);ord.push(pairs[pairs.length-1-i]);}
   koStage(comp,ord,0);return;}
  koPost(comp,s);}
}
function koPost0(comp){// плей-офф стыков еврокубков -> 1/8 с топ-8
 const s=comp.koSlots[0][1];const stg=comp.ko[0];const fx=G.season.fx.filter(f=>f.c===comp.k&&f.g===0);
 stg.ties.forEach((t,ti)=>{const f2=fx.find(f=>f.t===ti&&f.leg===2);t.w=f2.aggW;});
 const pairs=[];for(let i=0;i<8;i++)pairs.push([comp.direct[i],stg.ties[7-i].w]);koStage(comp,pairs,1);}

// --------- матч ---------
function sideOf(comp,ref,opp){
 if(G.mode==='coach'&&G.coach){const cs=coachSide(comp,ref,opp);if(cs)return cs;}
 if(comp.nat){const sq=(comp.squads[ref]||[]).map(i=>G.P[i]);if(sq.length<11)return {rating:comp.nr[ref],lu:null,ref};
  const lu=lineup(sq,0);const ub=G.user&&!G.user.retired&&ref===G.user.nat&&typeof uCaptBonus==='function'?uCaptBonus(1):0;return {rating:.4*NATIONS[ref][2]+.6*lu.rating+ub,lu,ref,nat:1};}
 const c=G.clubs[ref];if(c.ph)return {rating:c.rep,lu:null,ref};
 let rest=.05;const oc=G.clubs[opp];if(comp.kind==='cup')rest=c.r>oc.r+3?.35:.1;else if(comp.kind!=='league')rest=.06;
 const lu=lineup(squad(ref),rest);const ub=G.user&&!G.user.retired&&G.P[G.user.pid].cl===ref&&typeof uCaptBonus==='function'?uCaptBonus(0):0;return {rating:lu.rating+ub,lu,ref};}

function resultProbs(rs,rw,up){// rs - сильнее, rw - слабее
 const diff=rs-rw;const [mn,mx]=up;let nl;
 if(diff<=1)nl=.62;else if(diff<=4)nl=.62+(mx-.62)*(diff-1)/3;else if(diff<=16)nl=mx+(mn-mx)*(diff-4)/12;else nl=mn;
 const pd=nl*(diff<4?.42:.5);return {pw:nl-pd,pd};}
function scoreFor(res,diff,gm){// res: 1 сильный выиграл, 0 ничья, -1 слабый выиграл; возвращает [голы сильного, голы слабого]
 let ls=clamp(1.35+diff*.05,1,3.2),lw=clamp(1.05-diff*.03,.35,1.3);
 if(res===-1){const t=ls;ls=lw+.4;lw=Math.max(.6,t-.4);}if(gm){ls*=gm;lw*=gm;}
 for(let i=0;i<60;i++){if(res===0){const g=poisson((ls+lw)/2*.75);return [g,g];}
  const a=poisson(ls),b=poisson(lw);if(res===1&&a>b)return [a,b];if(res===-1&&b>a)return [a,b];}
 return res===1?[1,0]:res===-1?[0,1]:[1,1];}

function playFx(f){const comp=G.season.comps[f.c];

function youthFill(){for(const c of G.clubs){if(c.ph||(G.mode==='coach'&&G.coach&&c.id===G.coach.club))continue;const sq=squad(c.id);const cnt={GK:0,DEF:0,MID:0,FWD:0};sq.forEach(p=>cnt[GROUP[p.pos]]++);
 const need=[];const minG={GK:3,DEF:8,MID:7,FWD:5};for(const g in minG)for(let i=cnt[g];i<minG[g];i++)need.push(g);
 const early=G.year<2028;while(sq.length+need.length<(early?22:24))need.push(pick(['DEF','MID','FWD','MID','DEF']));
 const fa=G.P.filter(p=>!p.ret&&p.cl<0&&p.fa&&p.ac===undefined);
 const POSG={GK:['GK'],DEF:['CB','CB','LB','RB'],MID:['CDM','CM','CM','CAM'],FWD:['ST','LW','RW']};
 for(const g of need){
  {const lo=c.rep-(early?14:10),hi=c.rep+2;const cand=fa.filter(p=>p.cl<0&&GROUP[p.pos]===g&&p.ovr>=lo&&p.ovr<=hi).sort((a,b)=>(a.g?1:0)-(b.g?1:0)||b.ovr-a.ovr);
   if(cand.length&&(early||rnd()<.6)){const p=cand[0];p.fa=0;moveP(p,c.id);p.cy=ri(1,2);continue;}
   if(early||rnd()<.4){const src=G.clubs.filter(x=>!x.ph&&x.lg&&x.id!==c.id&&x.rep<c.rep-3&&x.rep>=c.rep-12&&x.pl.length>22&&!(G.mode==='coach'&&G.coach&&x.id===G.coach.club));const pl=src.length?squad(pick(src).id).filter(p=>!p.u&&!p.g&&GROUP[p.pos]===g&&p.ovr>=c.rep-10):[];if(pl.length){const p=pick(pl);moveP(p,c.id);continue;}}}
  const pos=pick(POSG[g]);const nat=rnd()<DOMESTIC[c.lg]?LG[c.lg].c:foreignNat(c.lg);const young=rnd()<.7;const age=young?ri(16,18):ri(19,24);

function applyDecision(choice){const u=G.user,p=G.P[u.pid];const pd=G.pending;
 if(pd.type==='winter'){if(choice){if(choice.type==='loan'){u.loan={club:choice.club,parent:u.contract.club};moveP(p,choice.club);}else{u.contract={club:choice.club,yrs:choice.yrs,wage:choice.wage};moveP(p,choice.club);}u.mor=clamp(u.mor+8,0,100);}G.pending=null;return;}
 if(choice==='retire'){u.retired=true;moveP(p,-1);p.ret=1;G.pending=null;return;}
 if(choice.type==='extend'){const lo=u.trait==='loyal';u.contract={club:choice.club,yrs:choice.yrs,wage:Math.round(choice.wage*(lo?1.1:1)/1000)*1000};modMor(lo?15:5);}
 else if(choice.type==='stay'){if(pd.stance.listed)u.mor=clamp(u.mor-10,0,100);}
 else if(choice.type==='loan'){u.loan={club:choice.club,parent:u.contract.club,opt:choice.opt||0};moveP(p,choice.club);}
 else if(choice.type==='transfer'){u.contract={club:choice.club,yrs:choice.yrs,wage:choice.wage};moveP(p,choice.club);u.mor=clamp(u.mor+6,0,100);}
 G.pending=null;G.year++;startSeason();}

 const fx=G.season?G.season.fx.map(f=>{const a=FXK.map(k=>f[k]);const x={};let has=0;for(const k in f){if(k==='i'||FXK.includes(k))continue;x[k]=f[k];has=1;}a.push(has?x:0);return a;}):[];
 return JSON.stringify(Object.assign({},G,{P,season:G.season?Object.assign({},G.season,{fx}):null}));}
function unpackGame(str){const o=JSON.parse(str);o.P=o.P.map(a=>a[2]===1&&a.length<=6&&typeof a[3]!=='string'?(a.length===3?{id:a[0],n:a[1],ret:1}:{id:a[0],n:a[1],ret:1,ry:a[3],lc:a[4],age:a[5]}):{id:a[0],n:a[1],nat:a[2],pos:a[3],age:a[4],ovr:a[5],pot:a[6],dt:a[7],on:a[8],cl:a[9],inj:a[10],s:a[11]||null,sl:a[12]||null,...(a[13]&1?{u:1}:{}),...(a[13]&2?{g:1}:{}),...(a[13]&4?{rl:1}:{}),...(a[13]&8?{fa:1}:{}),...(a[13]&16?{ntg:1}:{}),...(a[14]?Object.fromEntries(Object.entries(a[14]).filter(([k,v])=>v!==undefined&&v!==null)):{})});
 o.P.forEach(p=>{if(!p.ret){if(typeof p.ovr==='number')p.ovr=Math.round(p.ovr);if(typeof p.pot==='number')p.pot=Math.round(p.pot);}});
 if(o.season)o.season.fx=o.season.fx.map((a,i)=>{const f={i};FXK.forEach((k,j)=>f[k]=a[j]);if(a[7])Object.assign(f,a[7]);return f;});G=o;if(!G.rk&&G.clubs){rankCompress(true);G.rk=1;}if(!G.altv&&G.P){G.P.forEach(p=>{if(!p.ret&&!p.u&&!p.alt){const a=rollAlt(p.pos);if(a)p.alt=a;}});G.altv=1;}if(G.season&&G.mode!=='m38')natDepth();return G;}

const FX_RU={rep:'Репутация',mor:'Мораль',dev:'Очки развития',boost:'Шанс на старт ↑ (матчей)',bench:'Без старта (матчей)'};
function fxText(e){const r=[];const sg=v=>(v>0?'+':'−')+Math.abs(v);
 for(const k of ['rep','mor','dev'])if(e[k])r.push(FX_RU[k]+' '+sg(e[k]));
 if(e.attr)for(const k in e.attr)r.push(ATTR_RU[k]+' '+sg(e.attr[k]));
 if(e.inj)r.push('Риск травм '+(e.inj>0?'↑':'↓'));if(e.hurt)r.push('Может травмироваться');
 if(e.mw)r.push((e.mw>0?'Доход +':'Расходы ')+Math.round(Math.abs(e.mw)*100)+'% зарплаты');if(e.wage)r.push('Зарплата +'+Math.round(e.wage*100)+'%');
 if(e.boost)r.push('Шанс на старт ↑ ('+e.boost+' матча)');if(e.bench)r.push('Не в старте '+e.bench+' матч.');return r.join(' · ');}
function optText(o){return o.e?fxText(o.e):'Исход случайный: '+fxText(o.ok)+'  или  '+fxText(o.fail);}
function applyFx(u,e){if(e.rep)u.rep+=e.rep;if(e.mor)u.mor+=e.mor;if(e.dev)u.evDev=(u.evDev||0)+e.dev;if(e.inj)u.injRisk=Math.max(.6,u.injRisk+e.inj);
 if(e.mw)u.earnS+=Math.round(u.contract.wage*e.mw);if(e.wage)u.contract.wage=Math.round(u.contract.wage*(1+e.wage)/1000)*1000;
 if(e.attr){for(const k in e.attr)u.attr[k]=clamp(u.attr[k]+e.attr[k],10,99);syncUser();}
 if(e.boost)u.boost=Math.max(u.boost||0,e.boost);if(e.bench)u.benchN=(u.benchN||0)+e.bench;
 if(e.hurt&&rnd()<e.hurt){G.P[u.pid].inj=G.slot+ri(2,4);userInjury(3);return ' Вы получили лёгкую травму.';}return '';}

function applyEvent(i){const u=G.user;const e=EVENTS.find(x=>x.id===G.pending.id);const o=e.o[i];const m0=u.mor;let txt;
 if(o.e){txt=fxText(o.e)+'.'+applyFx(u,o.e);}else{const ok=rnd()<o.ch;const ef=ok?o.ok:o.fail;txt=(ok?o.okT:o.failT)+' '+fxText(ef)+'.'+applyFx(u,ef);}

function ballonScore(p,trophyB){const S=p.s;const ap=S[0];const avg=S[7]/ap;const grp=GROUP[p.pos];
  const lf=p.cl>=0?clamp((G.clubs[p.cl].rep-60)/24,.3,1.1):.5;
  let st=(avg-6.5)*40+S[2]*(grp==='FWD'?1.3:grp==='MID'?1.5:1.6)+S[3]*.8;
  if(grp==='DEF')st+=S[5]*.7+S[4]*.06;if(grp==='GK')st+=S[5]*.9+S[6]*.06;
  const big=(S[9]||0)*2.5+(S[10]||0)*.6+((grp==='GK'||grp==='DEF')?(S[12]||0)*1.2:0);
  return st*lf+big+(p.u?(G.user.ballonBoost||0):0)+(trophyB[p.cl]||0)+((S[11]||0)>0?(trophyB[p.nat]||0):0)+repOf(p)*.4;}
function ballonRace(){const trophyB={};const add=(t,v)=>{trophyB[t]=(trophyB[t]||0)+v;};
 for(const k in G.season.comps){const c=G.season.comps[k];if(c.winner===undefined||c.kind==='league')continue;add(c.winner,{UCL:15,UEL:5,UECL:2,LIB:5,ACL:3,CCC:2,WC:18,EURO:9,COPA:9,AFCON:4,ASIA:4}[k]||2);}
 const minA=Math.max(4,Math.round(Math.min(G.slot,79)/79*20));
 return G.P.filter(p=>!p.ret&&p.s&&p.s[0]>=minA).map(p=>({p,v:ballonScore(p,trophyB),rep:repOf(p)})).filter(x=>x.rep>=60&&x.p.ovr>=78).sort((a,b)=>b.v-a.v).slice(0,10);}

function styleEffect(side,my,opp,ost){const st=side.style;const xi=side.lu?side.lu.xi:null;const avg=xi&&xi.length?xi.reduce((s,x)=>s+x.e,0)/xi.length:my;
 const d=(sl)=>{const v=lineAvg(xi,sl);return v===null?0:v-avg;};const stronger=my>=opp,diff=my-opp;let adj=0,gm=1,inj=1;

function academySeasonEnd(){const C=G.coach;if(C.club===null)return [];const out=[];C.prog=C.prog||{};

  const pr0=progOf(p.id);if(pr0)progApply(p,pr0.k);const k='none';const e=progEff(p,k);const o0=p.ovr,p0=p.pot;p.age++;
  const g=p.age<=15?.22:p.age<=17?.18:.14;p.pot=clamp(Math.round(p.pot+e.pm+gauss()*e.sd),35,96);

 C.prog={};return out;}

// ручная расстановка: map — игроки по позициям схемы, bench — 9 запасных
function ensureMap(){const C=G.coach,t=C.tac;const slots=FORMS[t.form];const sq=squad(C.club).filter(p=>!p.ret);const ids=new Set(sq.map(p=>p.id));
 if(t.map&&t.mapForm===t.form&&t.map.length===slots.length){t.map=t.map.map(id=>ids.has(id)?id:null);t.bench=(t.bench||[]).filter(id=>ids.has(id)&&!t.map.includes(id));fillMap();return;}
 const pref=t.map?t.map.filter(id=>ids.has(id)).map(id=>G.P[id]):[];const base=pref.length>=8?pref:sq.filter(p=>!(p.inj>G.slot));
 const xi=greedy(base,0,null,slots);t.map=slots.map(()=>null);const used=new Set();
 slots.forEach((sl,i)=>{const x=xi.find(x=>x.sl===sl&&!used.has(x.p.id));if(x){t.map[i]=x.p.id;used.add(x.p.id);}});
 t.mapForm=t.form;t.bench=(t.bench||[]).filter(id=>ids.has(id)&&!used.has(id));fillMap();}
function fillMap(){const C=G.coach,t=C.tac;const slots=FORMS[t.form];const sq=squad(C.club).filter(p=>!p.ret);
 const hurt=p=>p&&p.inj>G.slot;t.away=t.away||{};
 for(const i in t.away){const p=G.P[t.away[i]];if(!p||p.cl!==C.club||p.ret||t.mapForm!==t.form){delete t.away[i];continue;}if(!hurt(p)){const cur=t.map[i];if(cur!==null&&cur!==undefined&&cur!==p.id)t.bench.unshift(cur);const j=t.map.indexOf(p.id);if(j>=0&&j!=i)t.map[j]=null;t.map[i]=p.id;t.bench=t.bench.filter(x=>x!==p.id);delete t.away[i];}}
 t.map.forEach((id,i)=>{if(id!==null&&id!==undefined&&hurt(G.P[id])){t.away[i]=id;t.map[i]=null;}});t.bench=(t.bench||[]).filter(id=>!hurt(G.P[id]));
 slots.forEach((sl,i)=>{if(t.map[i]!==null&&t.map[i]!==undefined)return;const used=new Set(t.map.filter(x=>x!==null));const c=sq.filter(p=>!used.has(p.id)&&!(p.inj>G.slot)).sort((a,b)=>(b.ovr+pcompat(sl,b))-(a.ovr+pcompat(sl,a)))[0];t.map[i]=c?c.id:null;});
 const used=new Set(t.map);t.bench=t.bench.filter(id=>!used.has(id));const rest=sq.filter(p=>!used.has(p.id)&&!t.bench.includes(p.id)&&!hurt(p)).sort((a,b)=>b.ovr-a.ovr);while(t.bench.length<9&&rest.length)t.bench.push(rest.shift().id);t.bench=t.bench.slice(0,9);t.xi=t.map.filter(x=>x!==null);}
function manualXI(av,form){const C=G.coach,t=C.tac;const slots=FORMS[form];const xi=[];const used=new Set();const miss=[];
 slots.forEach((sl,i)=>{const p=G.P[t.map[i]];if(p&&av.includes(p)&&!used.has(p.id)){xi.push({p,sl,e:p.ovr+pcompat(sl,p)});used.add(p.id);}else miss.push(sl);});
 if(miss.length){const pool=t.bench.map(id=>G.P[id]).filter(p=>p&&av.includes(p)&&!used.has(p.id)).concat(av.filter(p=>!used.has(p.id)));xi.push(...greedy(pool,0,[...used],miss));}
 return xi;}
function mapSwap(a,b){const C=G.coach,t=C.tac;ensureMap();const pidOf=x=>x.k==='s'?t.map[x.i]:x.id;const pa=pidOf(a),pb=pidOf(b);
 const put=(x,pid)=>{if(x.k==='s')t.map[x.i]=pid;else if(x.k==='b'){const j=t.bench.indexOf(x.id);if(j>=0){if(pid===null)t.bench.splice(j,1);else t.bench[j]=pid;}}};
 if(a.k==='r'&&b.k==='r')return;
 if(a.k==='r'){put(b,pa);}else if(b.k==='r'){put(a,pb);}else{put(a,pb);put(b,pa);}
 t.auto=false;t.manual=true;t.map=t.map.map((id,i,arr)=>id!==null&&arr.indexOf(id)===i?id:null);t.bench=t.bench.filter((id,i,arr)=>id!==null&&arr.indexOf(id)===i&&!t.map.includes(id));fillMap();}
function clubScout(){const C=G.coach;const nat=LG[G.clubs[C.club].lg].c;if(!C.cs||C.cs.club!==C.club)C.cs={club:C.club,n:genName(nat),nat};return C.cs;}
function genMarketLists(){const C=G.coach;C.tl=[];C.ll=[];
 for(const c of G.clubs){if(c.ph||c.id===C.club)continue;const sq=squad(c.id);const xi=new Set(greedy(sq,0).map(x=>x.p.id));

function coachTasksInit(){const C=G.coach;if(C.club===null||!G.season)return;const cid=C.club;
 const sq=squad(cid).filter(p=>!p.ret);C.ss=C.ss||{team:{}};
 Object.assign(C.ss,{pay0:payroll(cid),bud0:C.budget,ovr0:Object.fromEntries(sq.map(p=>[p.id,p.ovr])),top3:sq.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,3).map(p=>p.id),sales:0,spent:0,promo:0});
 const x=tctx();const av=shuffle(TASKS.filter(t=>{try{return t.app(x);}catch(e){return false;}}));const n=ri(2,3);
 C.tasks=av.slice(0,n).map(t=>{const par=t.par?t.par(x):null;const w=ri(10,15);return {id:t.id,par,w,pts:Math.round(w*.6),t:t.t(par)};});
 const m=cm();m.task=50;}
function taskState(tk,fin){const T=TASKS.find(t=>t.id===tk.id);if(!T||G.coach.club===null)return {v:'prog',cur:''};let r;try{r=T.st(tctx(),tk.par);}catch(e){r={ok:false,cur:''};}
 if(fin)return {v:r.ok?'done':'fail',cur:r.cur};return {v:r.dead?'fail':(r.ok&&r.sticky)?'done':'prog',ok:r.ok,cur:r.cur};}
function updTaskMetric(){const C=G.coach;if(C.club===null)return;const x=tctx();let s=0,k=0;
 for(const tk of C.tasks||[]){const st=taskState(tk);s+=st.v==='done'?100:st.v==='fail'?0:st.ok?75:50;k++;}
 if(C.obj&&x.pos){s+=(x.pos<=C.obj.target?100:x.pos<=C.obj.target+2?45:10)*2;k+=2;}
 if(k)cm().task=Math.round(s/k);}

function euroIn(cid){const c=G.season&&G.season.comps;if(!c)return 0;return inComp('UCL',cid)?3:inComp('UEL',cid)||inComp('LIB',cid)?2:inComp('UECL',cid)?1:0;}
function fanClub(p){if(hsh(p.id*17+3)>=.05)return null;const l=LEAGUES.find(x=>x.c===p.nat&&x.t===1);
 let cand=l?G.lgClubs[l.id]:G.clubs.filter(c=>!c.ph).sort((a,b)=>b.rep-a.rep).slice(0,40).map(c=>c.id);if(!cand||!cand.length)return null;return cand[Math.floor(hsh(p.id*29+11)*cand.length)];}

function interest(p){const C=G.coach;if(C.club===null)return {lv:2,s:0,fan:false};const to=G.clubs[C.club];const from=p.cl>=0?G.clubs[p.cl]:null;
 if(refusesCoach(p)||!canReturn(p))return {lv:0,s:-99,fan:false,why:refusesCoach(p)?'не хочет работать с вами':'недавно ушёл из вашего клуба'};
 const fr=from?from.rep:p.ovr-6;const fw=from&&from.lg?LG[from.lg].w:.6;const tw=to.lg?LG[to.lg].w:.6;
 let s=(to.rep-fr)*.55+(tw-fw)*5+(euroIn(C.club)-(from?euroIn(from.id):0))*1.5+(C.rep-50)/12;
 if(p.age>=30)s-=(p.age-29)*.5;if(!from)s+=3;
 const role=roleAt(C.club,p.ovr,p.pos);if(role==='Запасной')s-=5;else if(role==='Основной')s+=2;
 s+=(hsh(p.id*13+G.year*7)-.5)*6;const fan=fanClub(p)===C.club;if(fan)s+=12;
 const lv=s>=9?4:s>=3?3:s>=-2?2:s>=-7?1:0;return {lv,s,fan};}
function rivalsFor(p){const C=G.coach;let n=(p.ovr>=80?2:p.ovr>=74?1:0)+(p.age<=23&&p.pot>=p.ovr+6?1:0)+ri(0,1);if(n<=0)return [];
 const cand=G.clubs.filter(c=>!c.ph&&c.id!==C.club&&c.id!==p.cl&&c.rep>=p.ovr-4&&c.rep<=p.ovr+8);const out=[];
 for(let i=0;i<n&&cand.length;i++){const c=wpick(cand,x=>1+x.rep-(p.ovr-4));cand.splice(cand.indexOf(c),1);out.push({club:c.id,wage:Math.round(wageFor(p.ovr,c.id)*(1+rnd()*.3)/1000)*1000});}
 return out.sort((a,b)=>b.wage-a.wage);}

 d*=[1.4,1.3,1.1,1,.92][it.lv];if(it.fan)d*=.85;const rv=Math.max(0,...(N.rivals||[]).map(r=>r.wage));
 if(rv>d)d=Math.max(d,rv*(it.fan||it.lv>=4?.9:1.02));return Math.round(d/1000)*1000;}

 const add=(k,v)=>{if(!v)return;if(k==='trust')trAdd(v);else mAdd(k,v);};
 const K=[[.7,-.5],[0,0],[-.5,.4],[-1,1]][t];for(const k in d){if(d[k]>0)add(k,d[k]*K[0]);else if(d[k]<0)add(k,-d[k]*K[1]*-1);}
 const X=[{mor:3,atm:2},{mor:1},{mor:-3,atm:-1},{mor:-6,atm:-4,trust:-2}][t];for(const k in X)add(k,X[k]);
 const d2={trust:C.trust-b.trust,mor:m.mor-b.mor,atm:m.atm-b.atm,tac:m.tac-b.tac};pd.fx=Object.entries(d2).map(([k,v])=>[k,Math.round(v)]).filter(([k,v])=>v!==0);
 pd.tier=t;const fl=o.tx?o.tx[t]:'';pd.res=[fl,r].filter(Boolean).join(' ');return pd.res;};

function mkChoice(cat,t,d,o,x){return Object.assign({type:'choice',cat,t,d,o,who:G.mode==='coach'?'c':'p'},x||{});}

 rep:'Репутация',dev:'Очки развития',ctr:'Доверие тренера',cash:'Деньги',pot:'Потолок развития',mr:'Оценка в ближайшем матче',mg:'Гол в ближайшем матче',ma:'Пас в ближайшем матче',

function fxChips(e){const r=[];for(const k in e){const v=e[k];if(typeof v!=='number'||!v||!FXC_RU[k])continue;
 const good=k==='opp'?v<0:v>0;let t;if(k==='cash'||k==='budget')t=(v>0?'+':'−')+money(Math.abs(v));else if(k==='mg'||k==='ma')t=v>0?'да':'нет';else if(k==='mr'||k==='xr'||k==='opp')t=(v>0?'+':'−')+Math.abs(v).toFixed(1);else t=(v>0?'+':'−')+Math.abs(Math.round(v));
 r.push(`<span class="${good?'ok':'bad'}">${FXC_RU[k]} ${t}</span>`);}
 if(e.attr)for(const k in e.attr)r.push(`<span class="${e.attr[k]>0?'ok':'bad'}">${ATTR_RU[k]} ${e.attr[k]>0?'+':'−'}${Math.abs(e.attr[k])}</span>`);
 return r.length?`<div class="fxl">${r.join('')}</div>`:'';}

function optHint(o){if(o.s&&!/\d|%/.test(o.s))return o.s;return '';}
function fxPlain(e){const r=[];for(const k in e){const v=e[k];if(typeof v!=='number'||!v||!FXC_RU[k])continue;if(k==='cash'||k==='budget')r.push(FXC_RU[k]+' '+(v>0?'+':'−')+money(Math.abs(v)));else if(k==='mg'||k==='ma')r.push(FXC_RU[k]);else r.push(FXC_RU[k]+' '+(v>0?'+':'−')+(k==='mr'||k==='xr'||k==='opp'?Math.abs(v).toFixed(1):Math.abs(Math.round(v))));}
 if(e.attr)for(const k in e.attr)r.push(ATTR_RU[k]+' '+(e.attr[k]>0?'+':'−')+Math.abs(e.attr[k]));return r.join(' · ');}
// применение эффектов
function applyChoiceFx(e,who){if(!e)return;if(who==='c'){const C=G.coach;
  for(const k of ['mor','atm','tac'])if(e[k])mAdd(k,e[k]);if(e.trust)trAdd(e.trust);if(e.crep)C.rep=clamp(C.rep+e.crep,1,100);if(e.budget)C.budget=Math.max(0,C.budget+e.budget);
  if(e.fam){C.fam=C.fam||{};const s=C.tac.style;C.fam[s]=clamp((C.fam[s]||30)+e.fam,0,100);}
  if(e.xr||e.opp){C.mfx=C.mfx||{xr:0,opp:0};C.mfx.xr+=e.xr||0;C.mfx.opp+=e.opp||0;}
  relFromFx(e);if(e.fn)e.fn();return;}
 const u=G.user;if(e.rep)modRep(e.rep);if(e.mor)modMor(e.mor);if(e.dev)u.evDev=(u.evDev||0)+e.dev;if(e.ctr)ctrAdd(e.ctr);if(e.cash)u.earnS=(u.earnS||0)+e.cash;
 if(e.pot)u.pot=clamp(u.pot+e.pot,40,99);if(e.attr){for(const k in e.attr)u.attr[k]=clamp(u.attr[k]+e.attr[k],10,99);syncUser();}
 if(e.mr||e.mg||e.ma||e.mt||e.msv||e.mga){u.mfx=u.mfx||{r:0,g:0,a:0};u.mfx.r+=e.mr||0;if(e.mg)u.mfx.g=1;if(e.ma)u.mfx.a=1;if(e.mt)u.mfx.t=(u.mfx.t||0)+1;if(e.msv)u.mfx.sv=(u.mfx.sv||0)+1;if(e.mga)u.mfx.ga=1;}
 if(e.boost)u.boost=Math.max(u.boost||0,e.boost);if(e.bench)u.benchN=(u.benchN||0)+e.bench;if(e.fn)e.fn();
 u.rep=clamp(u.rep,1,100);u.mor=clamp(u.mor,0,100);}
function resolveChoice(i,forced){const pd=G.pending;const o=pd.o[i];let ef,txt,ok=null;
 if(o.e){ef=o.e;txt=o.r||'';}else{ok=forced!==undefined?!!forced:rnd()<o.ch;ef=ok?o.ok:o.fail;txt=ok?o.okT:o.failT;}
 applyChoiceFx(ef,pd.who);if(o.after)o.after(ok);pd.res={txt,ef,ok,opt:o.t};return pd.res;}

 if(pd.res){const R=pd.res;evModal(cat,`<h2>${esc(pd.t)}</h2>${R.ok===null?'':`<div class="tier ${R.ok?'t0':'t3'}">${R.ok?'Получилось':'Не получилось'}</div>`}<p class="small muted nh">Ваш выбор: ${esc(R.opt)}</p>${R.txt?`<p>${esc(R.txt)}</p>`:''}${fxChips(R.ef)}<div class="btns"><button class="btn big" id="chOk">Продолжить</button></div>`);
  $('#chOk').onclick=()=>{G.pending=null;save();contAfter();};return;}
 const isInfo=pd.o.length===1&&pd.info;
 evModal(cat,`<h2>${esc(pd.t)}</h2>${pd.d?`<p class="evd">${esc(pd.d)}</p>`:''}${pd.html||''}${pd.o.map((o,i)=>`<button class="evopt" data-ch="${i}"><b>${esc(o.t)}</b>${optHint(o)?`<span>${esc(optHint(o))}</span>`:''}</button>`).join('')}`);
 document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const oi=+b.dataset.ch;const oo=pd.o[oi];if(oo.mg&&typeof runMg==='function'){runMg(oo.mg,{gk:pd.oppGk,then:oo.then},ok=>{resolveChoice(oi,ok);save();showChoice();});return;}resolveChoice(+b.dataset.ch);save();if(isInfo){G.pending=null;save();contAfter();}else showChoice();});}

// ---------- характеры и тип развития: влияние на развитие и старение ----------
// множитель очков развития по характеру (зависит от возраста и ситуации)
function traitDevMul(u,age){const t=u.trait;
 switch(t){
  case 'pro':return age>=28?1.12:1.03;                 // дисциплина: к зрелости только сильнее
  case 'fragile':return .9;                              // пропуски из-за травм
  case 'iron':return 1.04;
  case 'talent':return age<=21?1.3:age<=23?1.1:age<=26?.9:.8;
  case 'media':return .93;                               // отвлекается на медиа
  case 'lazy':return .85;
  case 'leader':return age>=26?1.1:1;
  case 'sensitive':return 1;                             // зато мораль влияет в 1,5 раза сильнее
  case 'core':return 1.03;
  case 'clutch':return Object.keys(u.ss.k).some(k=>INTL.includes(k)&&u.ss.k[k][0]>0)?1.1:.97;
  case 'workhorse':return 1.1;
  case 'explosive':return age<=22?1.15:age>=28?.9:1;
  case 'greedy':return .95;
  case 'loyal':return (u.sameYrs||0)>=3?1.1:.98;
  case 'hothead':return u.hotRoll||1;                    // нестабилен: каждый сезон по-разному
  case 'shy':return 1.05;
  default:return 1;}}
// сдвиг начала спада и его резкость
function traitOnset(u){const t=u.trait;return (t==='pro'?2:0)+(t==='iron'?1:0)+(t==='workhorse'?1:0)+(t==='explosive'?-1:0)+(t==='fragile'?-1:0)+(t==='talent'?-1:0)+(t==='lazy'?-1:0)+(t==='leader'?1:0);}
function traitSharp(u){const t=u.trait;return t==='iron'?.75:t==='pro'?.8:t==='explosive'?1.25:t==='fragile'?1.2:t==='talent'?1.25:1;}
function dtOnset(dt){return dt===0?-3:dt===2?2:0;}
function dtSharp(dt){return dt===0?1.6:dt===2?.8:1;}

// ---------- доверие тренера ----------
function ctrAdd(v){const u=G.user;if(v>0&&u.trait==='leader')v*=1.2;if(v<0&&u.trait==='sensitive')v*=1.3;u.ctr=clamp((u.ctr??50)+v,0,100);}
function ctrSync(){const u=G.user;const cl=G.P[u.pid].cl;if(u.ctrClub!==cl){u.ctr=u.ctrClub===undefined?55:45;u.ctrClub=cl;u.ctrNote='Новый тренер — доверие нужно заработать заново';}}
function ctrLabel(v){return v>=80?'Незаменимый':v>=60?'Доверяет':v>=40?'Присматривается':v>=20?'Сомневается':'Не видит в составе';}
// после матча игрока
function p2AfterMatch(r,x){const u=G.user;uCaptAfterMatch();if(x.m<25)return;const pk=perkVal('ctrx')||1;
 const d=r>=8?2:r>=7.3?1.2:r>=6.8?.5:r<5.5?-2:r<6.1?-.8:0;ctrAdd(d>0?d*pk:d);u.ctr+=(50-u.ctr)*.03;}
// не играл — доверие медленно возвращается к нейтральному
function p2NoPlay(){const u=G.user;if(u.ctr!==undefined)u.ctr+=(50-u.ctr)*.02;}

// ---------- специализации ----------
const PERKS={
 FWD:[{k:'pen',n:'Пенальтист',d:'Забивает чаще',gw:1.15},{k:'fk',n:'Мастер штрафных',d:'Забивает чаще, оценки выше',gw:1.1,r:.1},{k:'head',n:'Игра головой',d:'Забивает чаще, доверие тренера растёт быстрее',gw:1.1,ctrx:1.3},{k:'drib',n:'Дриблёр',d:'Оценки выше, чаще отдаёт голевые',r:.2,aw:1.1}],
 MID:[{k:'play',n:'Диспетчер',d:'Заметно чаще отдаёт голевые',aw:1.2},{k:'b2b',n:'Box-to-box',d:'Чаще отбирает и забивает',tw:1.12,gw:1.12},{k:'motor',n:'Мотор команды',d:'Оценки выше, доверие тренера растёт быстрее',r:.15,ctrx:1.3},{k:'long',n:'Дальний удар',d:'Заметно чаще забивает издали',gw:1.18}],
 DEF:[{k:'wall',n:'Лидер обороны',d:'Выше оценки в сухих матчах, доверие растёт быстрее',rcs:.3,ctrx:1.3},{k:'tack',n:'Чистильщик',d:'Заметно чаще отбирает мяч',tw:1.2},{k:'over',n:'Подключения в атаку',d:'Чаще отдаёт голевые и иногда забивает',aw:1.25,gw:1.1},{k:'air',n:'Король воздуха',d:'Забивает со стандартов, оценки выше',gw:1.3,r:.1}],
 GK:[{k:'pk',n:'Пенальти-киллер',d:'Оценки выше',r:.2},{k:'refl',n:'Рефлексы',d:'Больше сейвов',sv:1.15},{k:'sweep',n:'Игра на выходах',d:'Оценки выше, доверие растёт быстрее',r:.15,ctrx:1.3},{k:'dist',n:'Передача рукой',d:'Иногда отдаёт голевые, оценки выше',aw:2,r:.1}]};
function perkGroup(){const g=GROUP[G.user.pos];return g==='GK'?'GK':g==='DEF'?'DEF':g==='MID'?'MID':'FWD';}
function myPerks(){const u=G.user;return (u.perks||[]).map(k=>PERKS[perkGroup()].find(x=>x.k===k)||Object.values(PERKS).flat().find(x=>x.k===k)).filter(Boolean);}
function perkVal(key){let v=0,m=1,any=false;for(const p of myPerks()){if(p[key]===undefined)continue;any=true;if(['gw','aw','tw','sv','ctrx'].includes(key))m*=p[key];else v+=p[key];}return ['gw','aw','tw','sv','ctrx'].includes(key)?(any?m:1):v;}

// ---------- цели сезона ----------
function seasonTotals(){const u=G.user;const t={ap:0,st:0,g:0,a:0,t:0,cs:0,sv:0,r:0,m:0};for(const e of u.log){if(e.nt||!e.m)continue;t.ap++;t.st+=e.st;t.g+=e.g;t.a+=e.a;t.t+=e.t;t.cs+=e.cs;t.sv+=e.sv;t.r+=e.r;t.m+=e.m;}t.avg=t.ap?t.r/t.ap:0;return t;}
const GOAL_RU={g:'Голы',a:'Голевые передачи',ga:'Голы + передачи',st:'Матчи в старте',avg:'Средняя оценка',t:'Отборы',cs:'Сухие матчи',sv:'Сейвы'};
function p2MakeGoals(){const u=G.user,p=G.P[u.pid];const cl=G.clubs[p.cl];const g=GROUP[u.pos];
 const lvl=clamp((p.ovr-(cl?cl.r:p.ovr))/6+1,.35,2);const role=userStatus();const sh=role==='Основной'?1:role==='Ротация'?.65:.35;
 const L=[];const add=(k,v)=>L.push({k,need:k==='avg'?r1(v):Math.max(1,Math.round(v))});
 if(g==='FWD'||u.pos==='CAM'){add('g',(5+8*lvl)*sh);add('ga',(8+10*lvl)*sh);}
 else if(g==='MID'){add('a',(3+5*lvl)*sh);add('t',(25+30*lvl)*sh);}
 else if(g==='DEF'){add('t',(30+35*lvl)*sh);add('cs',(4+6*lvl)*sh);}
 else {add('cs',(4+7*lvl)*sh);add('sv',(35+40*lvl)*sh);}
 add('st',Math.min(34,(8+14*lvl)*sh));add('avg',6.55+.2*lvl);
 const src=u.agent?'Цели обсудили тренер и ваш агент':'Цели поставил главный тренер';
 u.goals={src,L:shuffle(L).slice(0,3)};}
function goalHave(k,t){return k==='ga'?t.g+t.a:k==='avg'?r1(t.avg):t[k];}
function p2GoalsEval(){const u=G.user;if(!u.goals)return null;const t=seasonTotals();let met=0;const L=u.goals.L.map(x=>{const h=goalHave(x.k,t);const ok=x.k==='avg'?(t.ap>=10&&h>=x.need):h>=x.need;if(ok)met++;return Object.assign({},x,{have:h,ok});});return {L,met,n:L.length};}

// ---------- соперник-ровесник ----------
function p2PickRival(){const u=G.user,p=G.P[u.pid];const g=GROUP[u.pos];
 const c=G.P.filter(q=>!q.ret&&!q.u&&q.cl>=0&&q.cl!==p.cl&&!G.clubs[q.cl].ph&&GROUP[q.pos]===g&&Math.abs(q.age-p.age)<=1&&Math.abs(q.ovr-p.ovr)<=4);
 if(!c.length)return null;c.sort((a,b)=>(G.clubs[b.cl].rep-G.clubs[a.cl].rep)+(Math.abs(a.ovr-p.ovr)-Math.abs(b.ovr-p.ovr))*3);return c[ri(0,Math.min(3,c.length-1))].id;}
function rivalScore(S,grp){if(!S||!S[0])return 0;const avg=S[7]/S[0];return avg*10+(grp==='DEF'||grp==='GK'?S[5]*.8:S[2]+S[3]*.7)+S[1]*.15;}

function invPut(k,frac){const u=G.user;const I=invMig();const a=Math.floor(cash()*frac/1000)*1000;if(a<10000)return 'Недостаточно свободных денег';u.spent=(u.spent||0)+a;I[k]=I[k]||{v:0};I[k].v+=a;return 'Вложено '+fmtM(a)+': '+INV[k].n.toLowerCase()+'.';}
function invTake(k){const u=G.user;const I=invMig();const x=I[k];if(!x||!x.v)return '';const v=Math.round(x.v);u.spent=(u.spent||0)-v;x.v=0;if(ASSET[k])x.lv=0;return 'Продано за '+fmtM(v)+'.';}
function assetNext(k){const I=invMig();const lv=(I[k]&&I[k].lv)||0;return ASSET[k].lv[lv]||null;}
function assetBuy(k){const u=G.user;const I=invMig();const nx=assetNext(k);if(!nx)return 'Уже максимальный уровень';if(cash()<nx[1])return 'Недостаточно свободных денег';
 u.spent=(u.spent||0)+nx[1];I[k]=I[k]||{v:0,lv:0};I[k].lv=(I[k].lv||0)+1;I[k].v+=nx[1];modMor(I[k].lv>=3?3:1);return (I[k].lv===1?'Куплено: ':'Улучшено до уровня «')+nx[0]+(I[k].lv===1?'.':'».');}
function invSeason(sum){const u=G.user;const I=invMig();let d=0,inc=0;
 const ev=[];
 for(const k in INV){const x=I[k];if(!x||!x.v)continue;let r=INV[k].lo+rnd()*(INV[k].hi-INV[k].lo);
  // редкие провалы
  const D=INV_DIS[k];if(rnd()<D.p){r=-(D.lo+rnd()*(D.hi-D.lo));ev.push(D.t);}
  const dv=Math.round(x.v*r);x.v=Math.max(0,x.v+dv);d+=dv;}
 for(const k in ASSET){const x=I[k];if(!x||!x.v)continue;const A=ASSET[k];let g=A.gr[0]+rnd()*(A.gr[1]-A.gr[0]);let ir=A.inc[0]+rnd()*(A.inc[1]-A.inc[0]);
  const D=INV_DIS[k];if(rnd()<D.p){g=-(D.lo+rnd()*(D.hi-D.lo));ir=k==='biz'?-.05:0;ev.push(D.t);}
  const dv=Math.round(x.v*g);x.v=Math.max(0,x.v+dv);d+=dv;inc+=Math.round(x.v*ir);if(x.v<1000){x.v=0;x.lv=0;}}
 if(inc)u.spent=(u.spent||0)-inc;if(d)sum.invD=d;if(inc)sum.invInc=inc;if(ev.length){sum.invEv=ev;modMor(-3*ev.length);}}

  G.pending=mkChoice('goal','Новая специализация',`Ваш уровень (${p.ovr}) открыл ${(u.perks||[]).length?'вторую':'первую'} специализацию. Она будет давать бонус весь остаток карьеры.`,
   L.map(x=>({t:x.n,s:x.d,e:{fn:()=>{(u.perks=u.perks||[]).push(x.k);}},r:'Специализация «'+x.n+'» открыта.'})));return true;}
 // события в начале сезона: реклама, семья
 if(u.lifeQ&&u.lifeQ.length&&G.slot>=u.lifeQ[0].s&&evGate()){const q=u.lifeQ.shift();const ev=LIFE_EV[q.id];if(ev){G.pending=mkChoice(ev.cat,ev.t,ev.d(u),ev.o(u));evMark();return true;}}
 // ключевой момент матча
 if((u.momDone||0)<(u.momN||0)&&slotHasUser(G.slot)&&evGate()){const f=G.season.fx.find(x=>x.s===G.slot&&!x.p&&(x.h===p.cl||x.a===p.cl));
  if(f&&!(p.inj>G.slot)){const comp=G.season.comps[f.c];const opp=f.h===p.cl?f.a:f.h;const oR=comp.nat?70:(G.clubs[opp]?G.clubs[opp].r:70);const my=G.clubs[p.cl].r;
   const big=f.g!==undefined||oR>=my-1||G.slot>62;const left=(u.momN-u.momDone);
   if(big&&(rnd()<.4||G.slot>70-left*4)){u.momDone=(u.momDone||0)+1;G.pending=momentChoice(comp,opp);G.pending.oppGk=Math.round(oR);evMark();return true;}}}
 return false;}

 ctrSync();u.ctr=Math.round(u.ctr+(50-u.ctr)*.3);u.mfx=null;u.trUsed=0;u.trPts=0;u.evM=9;u.momN=ri(2,3);u.momDone=0;p2MakeGoals();
 if(u.trait==='hothead')u.hotRoll=r1(.85+rnd()*.35);
 if(!u.rival||!G.P[u.rival]||G.P[u.rival].ret||G.P[u.rival].cl===p.cl)u.rival=p2PickRival();
 u.rivalStart=null;
 // очередь событий жизни/бренда на сезон
 const q=[];const s=()=>ri(8,70);
 if(u.rep>=45&&rnd()<(u.agent===2?.8:u.agent===1?.6:.4))q.push({s:s(),id:'ad'});
 const L=u.life=u.life||{};if(p.age>=23&&!L.fam&&rnd()<.22)q.push({s:s(),id:'wed'});else if(L.fam===1&&p.age>=25&&rnd()<.3)q.push({s:s(),id:'kid'});

function p2Dev(devM,devAw,T,avgR,up){const u=G.user;const age=up.age;const out={};
 // мораль: у ранимых действует сильнее, у стержня — слабее
 // доверие тренера
 const c=u.ctr??50;devM.push(['Доверие тренера: '+ctrLabel(c),c>=80?1.08:c>=60?1.03:c>=40?1:c>=20?.94:.88]);
 // характер
 const tm=traitDevMul(u,age);if(tm!==1)devM.push(['Характер: '+TRAITS[u.trait][0],r1(tm*100)/100]);
 // соцсети
 if((u.social??1)===2)devM.push(['Активные соцсети',.95]);
 // жизнь: дом и семья — стабильность
 const L=u.life||{};if(L.house)devM.push(['Свой дом — спокойствие',1.03]);if(L.fam)devM.push(['Семья',L.fam===2?1.04:1.02]);
 // цели сезона
 const ge=p2GoalsEval();if(ge){out.goals=ge;if(ge.met)devAw.push(['Цели сезона: выполнено '+ge.met+' из '+ge.n,ge.met*2]);}
 // соперник-ровесник
 if(u.rival!==null&&u.rival!==undefined&&G.P[u.rival]){const rp=G.P[u.rival];const grp=GROUP[u.pos];const me=rivalScore(T,grp),him=rivalScore(rp.s,grp);
  out.rival={id:rp.id,n:rp.n,me:r1(me),him:r1(him),win:me>=him&&T[0]>=8};if(out.rival.win)devAw.push(['Обошли соперника: '+rp.n,2]);else if(u.trait==='core')devAw.push(['Проиграли соперничество — но это только заводит',1]);}
 return out;}
function p2SeasonEnd(sum){const u=G.user;const x=sum.p2||{};

 if(x.rival){if(x.rival.win){modMor(5);modRep(1);}else modMor(-4);}
 // агент берёт процент
 const A=AGENTS[u.agent||0];if(A.fee){const fee=Math.round(sum.earned*A.fee);u.spent=(u.spent||0)+fee;sum.agentFee=fee;}
 // инвестиции
 invSeason(sum);
 if((u.life||{}).car)modRep(1);if((u.life||{}).house)modMor(3);if((u.life||{}).fam)modMor(2);
 if((u.social??1)===0)modMor(2);
 // клуб тот же — растёт верность
 u.sameYrs=sum.club===u.lastClub?(u.sameYrs||0)+1:1;u.lastClub=sum.club;
 // специализации открываются уровнем
 const ovr=G.P[u.pid].ovr;const have=(u.perks||[]).length+(u.perkAvail||0);if(ovr>=75&&have<1)u.perkAvail=(u.perkAvail||0)+1;if(ovr>=85&&have<2)u.perkAvail=(u.perkAvail||0)+1;}
